<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Budget Copilot</title>
<meta name="description" content="Budgetary and management control revision: animated lessons, an Excel-like spreadsheet for every case, games and a mock exam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>/* Budget Copilot v2. Concept: a transit map of the course. Lessons are stations on three lines,
   the budget chain is the main line. Colour always means the same thing:
   green = profit / resource / right, red = outflow / need / wrong, blue = cash and actions,
   amber = stocks and assets, plum = equity, teal = cyclic items, yellow = your turn. */
:root {
  --bg: #F2F5FA; --sheet: #FFFFFF; --sheet-2: #F6F8FC; --ink: #121C33; --ink-2: #44506A; --ink-3: #6A7590;
  --rule: #DCE2ED; --rule-2: #C2CBDC;
  --blue: #2B59EE; --blue-2: #E3EAFE; --on-blue: #FFFFFF;
  --green: #0D8757; --green-2: #DCF2E7; --red: #D33F2C; --red-2: #FBE3DE;
  --amber: #DB850F; --amber-2: #FCEACC; --plum: #7650CC; --plum-2: #ECE5FA; --teal: #0E958F; --teal-2: #D6F1EF; --grey-c: #8792A8; --grey-2: #E7EBF2;
  --yellow: #FFF1B8; --yellow-2: #EFD466; --yellow-hi: #FFD84D; --yellow-ink: #6B5000;
  --given: #EEF1F7; --grid-head: #E7ECF5; --sel: #2B59EE;
  --ok: #0D8757; --ok-2: #DCF2E7; --ko: #D33F2C; --ko-2: #FBE3DE;
  --line-r: #DB850F; --line-b: #2B59EE; --line-c: #7650CC;
  --shadow: 0 1px 0 rgba(18, 28, 51, .04), 0 14px 30px -20px rgba(18, 28, 51, .4);
  --shadow-up: 0 2px 0 rgba(18, 28, 51, .05), 0 22px 40px -22px rgba(18, 28, 51, .45);
  --radius: 14px;
  --font-display: 'Big Shoulders', 'Big Shoulders Display', 'Sofia Sans Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1121; --sheet: #131A2D; --sheet-2: #182039; --ink: #E6EBF6; --ink-2: #A5AFC7; --ink-3: #7E89A4;
    --rule: #252F48; --rule-2: #35405D;
    --blue: #7D9CFF; --blue-2: #1B2851; --on-blue: #0A0F1E;
    --green: #4ED19A; --green-2: #133326; --red: #FF7B67; --red-2: #3B1D19;
    --amber: #FFB447; --amber-2: #3A2A10; --plum: #B69BFF; --plum-2: #2A2148; --teal: #46D2CA; --teal-2: #0F302E; --grey-c: #7E89A4; --grey-2: #222B42;
    --yellow: #38320F; --yellow-2: #5E531A; --yellow-hi: #FFD84D; --yellow-ink: #F2DA78;
    --given: #19213A; --grid-head: #1B2339; --sel: #7D9CFF;
    --ok: #4ED19A; --ok-2: #133326; --ko: #FF7B67; --ko-2: #3B1D19;
    --line-r: #FFB447; --line-b: #7D9CFF; --line-c: #B69BFF;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 30px -18px rgba(0, 0, 0, .8);
    --shadow-up: 0 2px 0 rgba(0, 0, 0, .3), 0 22px 40px -20px rgba(0, 0, 0, .85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1121; --sheet: #131A2D; --sheet-2: #182039; --ink: #E6EBF6; --ink-2: #A5AFC7; --ink-3: #7E89A4;
  --rule: #252F48; --rule-2: #35405D;
  --blue: #7D9CFF; --blue-2: #1B2851; --on-blue: #0A0F1E;
  --green: #4ED19A; --green-2: #133326; --red: #FF7B67; --red-2: #3B1D19;
  --amber: #FFB447; --amber-2: #3A2A10; --plum: #B69BFF; --plum-2: #2A2148; --teal: #46D2CA; --teal-2: #0F302E; --grey-c: #7E89A4; --grey-2: #222B42;
  --yellow: #38320F; --yellow-2: #5E531A; --yellow-hi: #FFD84D; --yellow-ink: #F2DA78;
  --given: #19213A; --grid-head: #1B2339; --sel: #7D9CFF;
  --ok: #4ED19A; --ok-2: #133326; --ko: #FF7B67; --ko-2: #3B1D19;
  --line-r: #FFB447; --line-b: #7D9CFF; --line-c: #B69BFF;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 30px -18px rgba(0, 0, 0, .8);
  --shadow-up: 0 2px 0 rgba(0, 0, 0, .3), 0 22px 40px -20px rgba(0, 0, 0, .85);
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px; background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent), var(--bg) 70%); pointer-events: none; z-index: -1; }
a { color: var(--blue); text-underline-offset: 2px; }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.1; }
h1, h2 { font-family: var(--font-display); font-weight: 800; letter-spacing: .005em; }
h1 { font-size: clamp(2.4rem, 5vw, 3.4rem); }
h2 { font-size: clamp(1.6rem, 3vw, 2rem); }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0 0 .8em; }
code { font-family: var(--font-mono); font-size: .86em; }
kbd { display: inline-block; padding: .05em .45em; border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 5px; background: var(--sheet); color: var(--ink); white-space: nowrap; font-family: var(--font-mono); font-size: .8em; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.hint { font-size: .9rem; color: var(--ink-2); margin: 10px 0 0; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.num .u { font-size: .6em; margin-left: .25em; color: var(--ink-3); }
.neg, .num.neg { color: var(--red); }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--sheet); padding: 8px 12px; border-radius: 8px; }
.skip:focus { left: 12px; }

/* ---------- Shell ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 18px;
  padding: max(8px, env(safe-area-inset-top, 0px)) var(--gut-r) 8px var(--gut);
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); flex: none; }
.brand span { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1; letter-spacing: .01em; }
.brand b { font-weight: 900; color: var(--blue); margin-left: 2px; }
.topnav { display: flex; gap: 2px; flex: 1; min-width: 0; }
.topnav a { text-decoration: none; color: var(--ink-2); padding: 7px 12px; border-radius: 99px; font-weight: 700; font-size: .95rem; white-space: nowrap; }
.topnav a:hover { color: var(--ink); background: var(--sheet); }
.topnav a.on { color: var(--on-blue); background: var(--blue); }
.top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--rule-2); }
.tk-m { display: none; }
.xp { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink-2); font-size: .85rem; padding: 4px 12px 4px 5px; border-radius: 99px; border: 1px solid var(--rule); background: var(--sheet); white-space: nowrap; }
.xp b { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); line-height: 1; }
.xp-l { color: var(--ink-3); margin-left: 4px; }
.xp-ring { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(var(--yellow-hi) calc(var(--p) * 360deg), var(--rule) 0); position: relative; }
.xp-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--sheet); }
.xp.bump { animation: bump .6s ease; }
@keyframes bump { 30% { transform: scale(1.12); border-color: var(--yellow-2); } }
main { flex: 1; outline: none; padding-bottom: 40px; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 22px var(--gut-r) calc(22px + env(safe-area-inset-bottom, 0px)) var(--gut); border-top: 1px solid var(--rule); color: var(--ink-3); font-size: .82rem; background: var(--bg); }
.foot span { flex: 1 1 320px; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .topnav, .xp-l { display: none; }
  .topbar { gap: 10px; }
  .top-r { gap: 6px; }
  .iconbtn { width: 36px; height: 36px; border-radius: 10px; }
  .xp { padding: 3px 10px 3px 4px; }
  .brand span { font-size: 1.3rem; }
  .tk-m { display: inline-grid; }
  .tabbar {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: color-mix(in srgb, var(--sheet) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--rule); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  .tabbar a { display: grid; justify-items: center; gap: 1px; text-decoration: none; color: var(--ink-3); font-size: .68rem; font-weight: 700; padding: 4px 0; border-radius: 10px; }
  .tabbar a.on { color: var(--blue); background: var(--blue-2); }
  .foot { padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- Layout ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 26px var(--gut-r) 0 var(--gut); }
.page.narrow { max-width: 780px; }
.page.wide { max-width: 1440px; }
.phead { margin: 6px 0 22px; }
.phead p { color: var(--ink-2); max-width: 62ch; font-size: 1.05rem; }
.section { margin-top: 40px; }
.section.first { margin-top: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sec-head h2 { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.center { justify-content: center; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 12px; }
.panel summary { cursor: pointer; font-weight: 700; }
.crumb { display: inline-flex; align-items: center; gap: 4px; font-size: .88rem; color: var(--ink-2); text-decoration: none; margin-bottom: 6px; }
.crumb:hover { color: var(--blue); }

/* ---------- Buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); cursor: pointer; font-size: .93rem; line-height: 1.2; text-decoration: none; font-weight: 600; transition: transform .12s, border-color .12s; }
.btn:hover:not(:disabled) { border-color: var(--blue); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); font-weight: 700; box-shadow: 0 3px 0 color-mix(in srgb, var(--blue) 55%, var(--ink)); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn-primary:active:not(:disabled) { box-shadow: 0 1px 0 color-mix(in srgb, var(--blue) 55%, var(--ink)); transform: translateY(2px); }
.btn-ghost { background: transparent; }
.btn.on { background: var(--blue-2); border-color: var(--blue); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn-lg { padding: 12px 20px; font-size: 1.02rem; border-radius: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); border-radius: 99px; padding: 5px 12px; font-size: .86rem; cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--blue); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select { font: inherit; font-size: .92rem; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); max-width: 100%; }
.search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); font-size: 1rem; }

/* ---------- Home ---------- */
.hero { display: grid; grid-template-columns: 1fr minmax(240px, 300px); gap: 24px; align-items: end; margin: 8px 0 18px; }
.hero h1 { font-size: clamp(3rem, 8vw, 5.6rem); line-height: .9; margin-bottom: 12px; font-weight: 900; }
.hero p { font-size: 1.12rem; color: var(--ink-2); max-width: 56ch; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.lvlcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.lvl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lvl-top b { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.1; }
.lvl-top span { color: var(--ink-2); font-size: .9rem; }
.lvl-bar { height: 10px; border-radius: 99px; background: var(--grey-2); overflow: hidden; margin: 8px 0 6px; }
.lvl-bar i { display: block; height: 100%; background: var(--yellow-hi); border-radius: 99px; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.lvlcard small { color: var(--ink-3); }

/* the budget chain (hero animation) */
.chain { background: var(--sheet); border: 1px solid var(--rule); border-radius: 22px; box-shadow: var(--shadow-up); padding: 22px 22px 18px; overflow: hidden; }
.chain-line { position: relative; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; padding-top: 4px; }
.chain-track { position: absolute; left: calc(100% / 18); right: calc(100% / 18); top: 20px; height: 8px; border-radius: 99px; background: var(--grey-2); }
.chain-track i { display: block; height: 100%; border-radius: 99px; background: var(--line-b); transition: width .9s cubic-bezier(.5, 0, .2, 1); }
.stn { position: relative; display: grid; justify-items: center; gap: 6px; background: none; border: 0; cursor: pointer; padding: 0 2px; color: var(--ink-3); text-align: center; }
.stn i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; background: var(--sheet); border: 4px solid var(--grey-2); color: var(--ink-3); transition: all .35s; }
.stn span { font-size: .78rem; line-height: 1.2; font-weight: 700; }
.stn.past i { border-color: var(--line-b); color: var(--line-b); }
.stn.on i { background: var(--line-b); border-color: var(--line-b); color: var(--on-blue); transform: scale(1.18); box-shadow: 0 0 0 7px color-mix(in srgb, var(--line-b) 18%, transparent); }
.stn.on span { color: var(--ink); }
.chain-board { position: relative; margin-top: 20px; padding: 18px 20px; border-radius: 16px; background: var(--sheet-2); border: 1px solid var(--rule); display: grid; grid-template-columns: auto 1fr; grid-template-areas: "step step" "name val" "sub val"; column-gap: 20px; align-items: end; min-height: 140px; }
.cb-step { grid-area: step; font-size: .85rem; color: var(--ink-3); }
.cb-name { grid-area: name; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.4vw, 2.4rem); line-height: 1; animation: rise .45s ease both; }
.cb-sub { grid-area: sub; color: var(--ink-2); animation: rise .45s .08s ease both; }
.cb-val { grid-area: val; justify-self: end; font-family: var(--font-display); font-weight: 900; font-size: clamp(3rem, 9vw, 6.2rem); line-height: .85; color: var(--ink); }
.cb-val small { font-size: .3em; color: var(--ink-3); margin-left: .3em; font-weight: 700; }
.cb-val.neg { color: var(--red); }
.cb-val .eqx { color: var(--green); }
.chain-board .sbtn { position: absolute; top: 12px; right: 12px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (max-width: 760px) {
  .chain { padding: 16px 12px 14px; }
  .stn span { display: none; }
  .stn i { width: 30px; height: 30px; font-size: 1rem; border-width: 3px; }
  .chain-track { top: 15px; height: 6px; }
  .chain-board { grid-template-columns: 1fr; grid-template-areas: "step" "name" "sub" "val"; row-gap: 4px; }
  .cb-val { justify-self: start; margin-top: 8px; }
}
.chain.compact .chain-board { min-height: 120px; }

/* network map */
.netmap { display: grid; gap: 14px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); }
.mline { --lc: var(--line-b); display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: start; }
.ml-refresh { --lc: var(--line-r); }
.ml-control { --lc: var(--line-c); }
.ml-name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--lc); padding-top: 6px; }
.ml-track { position: relative; display: flex; gap: 6px; }
.ml-track::before { content: ""; position: absolute; left: 18px; right: 18px; top: 15px; height: 6px; border-radius: 99px; background: var(--lc); opacity: .9; }
.mstn { position: relative; flex: 1 1 0; min-width: 0; display: grid; justify-items: center; text-align: center; gap: 6px; text-decoration: none; color: var(--ink); }
.mstn i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.05rem; background: var(--sheet); border: 5px solid var(--lc); color: var(--lc); transition: transform .2s; }
.mstn span { font-size: .84rem; font-weight: 700; line-height: 1.2; }
.mstn:hover i { transform: scale(1.12); }
.mstn.done i { background: var(--lc); color: var(--sheet); }
@media (max-width: 700px) {
  .mline { grid-template-columns: 1fr; gap: 6px; }
  .ml-track { flex-direction: column; gap: 10px; padding-left: 4px; }
  .ml-track::before { left: 19px; right: auto; top: 14px; bottom: 14px; width: 6px; height: auto; }
  .mstn { grid-template-columns: 36px 1fr; justify-items: start; text-align: left; align-items: center; gap: 12px; }
}
.qplay { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.qp { display: grid; gap: 2px; padding: 16px; border-radius: var(--radius); text-decoration: none; color: var(--ink); border: 1px solid var(--rule); background: var(--sheet); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.qp:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
.qp svg { margin-bottom: 6px; }
.qp b { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.1; }
.qp span { color: var(--ink-2); font-size: .9rem; }
.qp-quiz svg { color: var(--blue); } .qp-sort svg { color: var(--amber); } .qp-drill svg { color: var(--red); } .qp-exam svg { color: var(--plum); }
.resume { margin-top: 14px; color: var(--ink-2); }

/* learn index */
.lline { --lc: var(--line-b); margin-bottom: 30px; }
.lline h2 { color: var(--lc); }
.lrows { list-style: none; margin: 0; padding: 0; position: relative; }
.lrows::before { content: ""; position: absolute; left: 22px; top: 22px; bottom: 22px; width: 6px; border-radius: 99px; background: var(--lc); }
.lrows li a { position: relative; display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px 10px 0; text-decoration: none; color: var(--ink); border-radius: 14px; }
.lrows li a:hover { background: var(--sheet); }
.lr-dot { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; background: var(--sheet); border: 6px solid var(--lc); color: var(--lc); }
.lrows li.done .lr-dot { background: var(--lc); color: var(--sheet); }
.lr-main { display: grid; }
.lr-main b { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.15; }
.lr-main span { color: var(--ink-2); }
.lr-meta { color: var(--ink-3); font-size: .85rem; white-space: nowrap; }
@media (max-width: 600px) { .lrows li a { grid-template-columns: 50px 1fr; } .lr-meta { grid-column: 2; } }

/* ---------- Scene player ---------- */
.scene { margin: 0; }
.scene-stage { position: relative; min-height: 200px; }
.scene-cap { min-height: 3.1em; margin: 14px 0 0; font-size: 1.04rem; line-height: 1.45; color: var(--ink); animation: capIn .4s ease both; }
@keyframes capIn { from { opacity: 0; transform: translateY(6px); } }
.scene-ctrl { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.sbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; font-size: .9rem; line-height: 1; padding: 0; }
.sbtn:hover:not(:disabled) { color: var(--ink); border-color: var(--blue); }
.sbtn:disabled { opacity: .35; cursor: default; }
.sbtn.play { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sdots { display: flex; gap: 5px; margin-left: 6px; flex-wrap: wrap; }
.sdot { width: 22px; height: 7px; border-radius: 99px; border: 0; padding: 0; background: var(--grey-2); cursor: pointer; transition: background .3s, width .3s; }
.sdot.past { background: color-mix(in srgb, var(--blue) 45%, var(--grey-2)); }
.sdot.on { background: var(--blue); width: 34px; }

/* colour blocks */
.c-green { --c: var(--green); --c2: var(--green-2); }
.c-red { --c: var(--red); --c2: var(--red-2); }
.c-blue { --c: var(--blue); --c2: var(--blue-2); }
.c-amber { --c: var(--amber); --c2: var(--amber-2); }
.c-amber2 { --c: color-mix(in srgb, var(--amber) 70%, var(--yellow-hi)); --c2: var(--amber-2); }
.c-teal { --c: var(--teal); --c2: var(--teal-2); }
.c-plum { --c: var(--plum); --c2: var(--plum-2); }
.c-grey { --c: var(--grey-c); --c2: var(--grey-2); }

/* waterfall */
.wf { box-sizing: content-box; position: relative; display: flex; gap: 6px; align-items: stretch; padding: 24px 0 48px; }
.wf-plot { position: absolute; left: 0; right: 0; top: 24px; bottom: 48px; pointer-events: none; }
.wf-zero { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink-3); opacity: .5; transform: translateY(1px); }
.wf-line { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--red); z-index: 2; }
.wf-line span { position: absolute; right: 0; bottom: 3px; font-size: .74rem; font-weight: 700; color: var(--red); background: var(--sheet); padding: 0 4px; border-radius: 4px; }
.wf-col { position: relative; flex: 1 1 0; min-width: 0; }
.wf-bar { position: absolute; left: 10%; right: 10%; border-radius: 6px; background: var(--grey-c); transition: bottom .7s cubic-bezier(.3, .9, .3, 1), height .7s cubic-bezier(.3, .9, .3, 1), opacity .4s; opacity: 0; }
.wf-bar.vis { opacity: 1; }
.wf-bar.pos { background: var(--green); } .wf-bar.neg { background: var(--red); } .wf-bar.tot { background: var(--ink); } .wf-bar.tot2 { background: var(--plum); }
.wf-bar.amber { background: var(--amber); } .wf-bar.blue { background: var(--blue); } .wf-bar.grey { background: var(--grey-c); } .wf-bar.red { background: var(--red); } .wf-bar.plum { background: var(--plum); } .wf-bar.green { background: var(--green); }
.wf-val { position: absolute; left: 50%; transform: translateX(-50%); bottom: 100%; margin-bottom: 3px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; white-space: nowrap; color: var(--ink); }
.wf-lab { position: absolute; top: 100%; left: -2px; right: -2px; margin-top: 6px; font-size: .74rem; line-height: 1.15; text-align: center; color: var(--ink-3); opacity: .35; transition: opacity .3s; }
.wf-val.below { bottom: auto; top: 100%; margin: 3px 0 0; }
.wf.has-neg { padding-bottom: 70px; }
.wf.has-neg .wf-plot { bottom: 70px; }
.wf.has-neg .wf-lab { margin-top: 30px; }
.wf-lab.vis { opacity: 1; color: var(--ink-2); }
@media (max-width: 560px) { .wf-val { font-size: .86rem; } .wf-lab { font-size: .64rem; } .wf { gap: 3px; } }

/* stacks (balance sheet) */
.stk { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 520px; margin: 0 auto; }
.stk-body { display: flex; flex-direction: column; justify-content: flex-end; background: repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb, var(--rule) 60%, transparent) 6px 7px); border-radius: 10px; overflow: hidden; }
.stk-blk { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 10px; background: var(--c2); border-left: 6px solid var(--c); overflow: hidden; transition: height .7s cubic-bezier(.3, .9, .3, 1), outline-color .3s; min-height: 0; outline: 3px solid transparent; outline-offset: -3px; }
.stk-blk + .stk-blk { border-top: 2px solid var(--sheet); }
.stk-blk.vis { min-height: 24px; }
.stk-blk.hl { outline-color: var(--ink); }
.stk-lab { font-size: .82rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stk-v { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.stk-foot { display: flex; justify-content: space-between; padding: 6px 4px 0; border-top: 3px solid var(--ink); margin-top: 4px; font-family: var(--font-display); font-size: 1.15rem; }
.stk-foot b { font-weight: 800; }

/* slider, segmented */
.sl { display: grid; gap: 4px; font-size: .9rem; }
.sl-top { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-2); }
.sl-top b { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); line-height: 1; }
.sl input[type=range] { width: 100%; accent-color: var(--blue); height: 26px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: var(--grey-2); margin-bottom: 14px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; font-weight: 700; font-size: .88rem; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- Lesson player ---------- */
.lesson { --lc: var(--line-b); max-width: 880px; }
.lesson.ml-refresh { --lc: var(--line-r); }
.lesson.ml-control { --lc: var(--line-c); }
.les-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.les-back { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); flex: none; }
.les-name { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.les-name i { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; border: 5px solid var(--lc); color: var(--lc); background: var(--sheet); }
.les-name span { display: grid; min-width: 0; }
.les-name small { color: var(--lc); font-weight: 700; font-size: .8rem; }
.les-name b { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.les-count { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--ink-3); white-space: nowrap; }
.segs { display: flex; gap: 4px; margin-bottom: 16px; }
.seg-b { flex: 1; height: 8px; border-radius: 99px; border: 0; padding: 0; background: var(--grey-2); cursor: pointer; transition: background .3s; }
.seg-b.past { background: color-mix(in srgb, var(--lc) 55%, var(--grey-2)); }
.seg-b.on { background: var(--lc); }
.seg-b.q { border-radius: 2px; }
.seg-b.ok { background: var(--green); } .seg-b.ko { background: var(--red); }
.stage { scroll-margin-top: 80px; }
.lcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: 22px; padding: 24px 26px 22px; box-shadow: var(--shadow-up); animation: lcIn .42s cubic-bezier(.2, .8, .2, 1) both; }
.lcard.back { animation-name: lcBack; }
@keyframes lcIn { from { opacity: 0; transform: translateX(34px); } }
@keyframes lcBack { from { opacity: 0; transform: translateX(-34px); } }
.lc-t { font-size: clamp(1.8rem, 4vw, 2.5rem); margin-bottom: 16px; }
.lc-v { margin-bottom: 4px; }
.lc-x { font-size: 1.06rem; color: var(--ink-2); margin: 16px 0 0; max-width: 64ch; }
.fstrip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.fstrip span { font-family: var(--font-mono); font-size: .86rem; background: var(--blue-2); color: var(--ink); border-left: 4px solid var(--blue); padding: 7px 11px; border-radius: 6px; line-height: 1.4; }
.trap { display: flex; gap: 10px; align-items: baseline; margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--red-2); border: 1px dashed var(--red); font-size: .95rem; }
.trap b { color: var(--red); font-family: var(--font-display); font-size: 1.15rem; flex: none; }
.les-nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 16px; position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 35%); }
.les-nav .btn-primary { margin-left: auto; min-width: 140px; justify-content: center; }
@media (max-width: 860px) { .les-nav { bottom: calc(62px + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; } }
@media (max-width: 560px) { .lcard { padding: 18px 14px 16px; border-radius: 18px; } .les-name b { font-size: 1.2rem; } }
.chk-tag { display: inline-block; font-weight: 700; font-size: .85rem; color: var(--yellow-ink); background: var(--yellow); border: 1px solid var(--yellow-2); padding: 2px 10px; border-radius: 99px; margin-bottom: 10px; }
.chk-q { font-family: var(--font-body); font-weight: 700; font-size: 1.25rem; line-height: 1.4; }
.numin { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 10px; }
.numin input { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; padding: 6px 14px; border-radius: 12px; border: 2px solid var(--yellow-2); background: var(--yellow); color: var(--ink); width: 220px; max-width: 100%; }
.numin input:focus { outline: 3px solid var(--blue); outline-offset: 1px; }
.numin .unit { color: var(--ink-2); font-weight: 700; }
.opts { display: grid; gap: 8px; margin: 6px 0 12px; }
.opt { text-align: left; border: 1px solid var(--rule-2); background: var(--sheet-2); border-radius: 12px; padding: 11px 14px; cursor: pointer; color: var(--ink); display: flex; gap: 12px; align-items: flex-start; font-size: 1rem; transition: border-color .15s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt:active:not(:disabled) { transform: scale(.995); }
.opt .k { font-family: var(--font-display); font-weight: 900; font-size: 1.05rem; color: var(--ink-3); flex: none; width: 1.2em; }
.opt.ok { background: var(--ok-2); border-color: var(--ok); animation: pop .35s; }
.opt.ko { background: var(--ko-2); border-color: var(--ko); animation: shake .3s; }
.opt.sel { border-color: var(--blue); background: var(--blue-2); }
.opt:disabled { cursor: default; }
@keyframes pop { 40% { transform: scale(1.025); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.fb { border-radius: 12px; padding: 11px 14px; font-size: .97rem; animation: capIn .3s ease both; }
.fb.ok { background: var(--ok-2); border: 1px solid var(--ok); }
.fb.ko { background: var(--ko-2); border: 1px solid var(--ko); }
.endc { text-align: center; display: grid; justify-items: center; }
.end-badge i { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 2.3rem; background: var(--lc); color: var(--sheet); box-shadow: 0 0 0 10px color-mix(in srgb, var(--lc) 20%, transparent); animation: badge .7s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes badge { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
.endc h2 { margin-top: 18px; font-size: 2.4rem; }
.take { list-style: none; padding: 0; margin: 4px 0 6px; display: grid; gap: 8px; max-width: 560px; text-align: left; }
.take li { padding: 10px 14px 10px 40px; position: relative; background: var(--sheet-2); border-radius: 12px; border: 1px solid var(--rule); animation: rise .45s ease both; }
.take li::before { content: "✓"; position: absolute; left: 14px; top: 9px; color: var(--green); font-weight: 900; }
.end-block { margin-top: 18px; width: 100%; }
.end-block h3 { margin-bottom: 10px; }
.end-block .row { justify-content: center; }
.mini-cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; text-align: left; }
.mcase { display: grid; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet-2); text-decoration: none; color: var(--ink); position: relative; }
.mcase:hover { border-color: var(--blue); }
.mcase b { font-family: var(--font-display); font-size: 1.3rem; }
.mcase span { font-size: .86rem; color: var(--ink-2); }
.mcase em { position: absolute; top: 10px; right: 12px; font-style: normal; font-size: .8rem; color: var(--green); font-weight: 700; }
.end-nav { justify-content: center; margin-top: 24px; }

/* ---------- Practice ---------- */
.exam-cta { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: var(--radius); background: var(--ink); color: var(--bg); text-decoration: none; box-shadow: var(--shadow-up); }
.exam-cta svg { color: var(--yellow-hi); flex: none; }
.exam-cta span { display: grid; }

.exam-cta small { opacity: .8; }
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.casec { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--sheet); text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.casec:hover { border-color: var(--blue); transform: translateY(-1px); }
.ring { --p: 0; width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 360deg), var(--grey-2) 0); display: grid; place-items: center; }
.ring i { width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); display: grid; place-items: center; font-style: normal; font-size: .76rem; font-weight: 700; color: var(--ink-2); }
.cc-main { display: grid; min-width: 0; }
.cc-main b { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.1; }
.cc-main span { font-size: .87rem; color: var(--ink-2); }
.cc-lvl { color: var(--amber); letter-spacing: 1px; font-size: .8rem; }
.casec.done { border-color: color-mix(in srgb, var(--green) 50%, var(--rule)); }
.caseplay .cp-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.cp-head h1 { margin: 0 0 4px; }
.cp-head p { margin: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; padding: 0 2px; }
.tabs > button, .tabs > a { flex: none; border: 1px solid var(--rule-2); border-bottom: 0; background: var(--grid-head); color: var(--ink-2); padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: .88rem; font-weight: 700; text-decoration: none; }
.tabs > .on { background: var(--sheet); color: var(--ink); box-shadow: inset 0 3px 0 var(--blue); }
.tabs > .ok .tick { color: var(--green); margin-right: 5px; }

.cp-layout { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.cp-layout.full { grid-template-columns: minmax(0, 1fr); }
.cp-layout.full .cp-side { display: none; }
.cp-side { position: sticky; top: 76px; max-height: calc(100vh - 90px); overflow: auto; }
.p-step { font-size: .82rem; color: var(--ink-3); font-weight: 700; }
.p-intro { font-size: .95rem; color: var(--ink-2); }
.p-intro p:last-child { margin-bottom: 0; }
.st-body { font-size: .9rem; margin-top: 8px; }
.st-body h4 { margin: 4px 0 6px; }
.st-body table { border-collapse: collapse; font-size: .82rem; margin: 6px 0; }
.st-body td, .st-body th { border: 1px solid var(--rule); padding: 3px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--rule-2); }
.lg-in { background: var(--yellow); } .lg-given { background: var(--given); } .lg-free { background: var(--sheet); }
.res-list { margin: 8px 0 0; padding-left: 18px; font-size: .84rem; }
.step-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
@media (max-width: 980px) { .cp-layout { grid-template-columns: minmax(0, 1fr); } .cp-side { position: static; max-height: none; } }
.cp-side, .cp-main { min-width: 0; }
.st-body { overflow-x: auto; }
.res-list code { word-break: break-word; }

/* ---------- Arcade ---------- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.game { --gc: var(--blue); position: relative; display: grid; gap: 4px; padding: 18px 18px 16px; border-radius: 18px; text-decoration: none; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-top: 6px solid var(--gc); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }

.g-flash { --gc: var(--plum); } .g-sort { --gc: var(--amber); } .g-drill { --gc: var(--red); } .g-journal { --gc: var(--teal); } .g-tf { --gc: var(--green); }
.qbar { display: flex; gap: 4px; margin: 16px 0 12px; }
.qbar i { flex: 1; height: 8px; border-radius: 99px; background: var(--grey-2); transition: background .3s; }
.qbar i.on { background: var(--ink-3); } .qbar i.ok { background: var(--green); } .qbar i.ko { background: var(--red); }
.quiz { background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: 20px; box-shadow: var(--shadow); animation: capIn .35s ease both; }
.quiz-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .86rem; color: var(--ink-2); margin-bottom: 8px; }
.quiz-q { font-size: 1.25rem; font-weight: 700; line-height: 1.4; margin: 4px 0 12px; }
.streak { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; color: var(--ink-3); }
.streak.hot { color: var(--red); animation: pop .4s; }
.kbd-hint { font-size: .82rem; color: var(--ink-3); margin: 0; }
.result { text-align: center; }
.big-score { font-family: var(--font-display); font-weight: 900; font-size: 5rem; line-height: 1; color: var(--blue); animation: badge .6s cubic-bezier(.2, 1.6, .4, 1) both; }
.big-score small { font-size: .4em; color: var(--ink-3); }
.review { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; display: grid; gap: 8px; }
.review li { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--sheet-2); border-left: 4px solid var(--red); }
.review span { color: var(--green); font-weight: 700; }

.fl-prog { display: flex; align-items: center; gap: 12px; margin: 14px 0; }

.fl-prog span { font-size: .86rem; color: var(--ink-2); white-space: nowrap; }
.flash { perspective: 1400px; margin-bottom: 14px; }
.flash-inner { position: relative; display: block; width: 100%; min-height: 300px; border: 0; padding: 0; background: none; transition: transform .55s cubic-bezier(.3, .8, .3, 1); transform-style: preserve-3d; cursor: pointer; text-align: left; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--sheet); border: 1px solid var(--rule); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 12px; box-shadow: var(--shadow-up); overflow: auto; }
.flash-face.back { transform: rotateY(180deg); background: var(--sheet-2); border-color: var(--plum); font-size: 1.02rem; }
.flash-face small { color: var(--ink-3); }
.flash-face .big { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; line-height: 1.15; }
.flash-face em { color: var(--ink-3); font-size: .84rem; }
.fkey { align-self: flex-start; background: var(--plum-2); color: var(--plum); border-radius: 8px; padding: 4px 10px; font-size: .9rem; }
.sortg { display: grid; gap: 16px; }
.sort-item { position: relative; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 4.5vw, 2.3rem); line-height: 1.15; text-align: center; padding: 30px 16px; border: 2px dashed var(--rule-2); border-radius: 20px; background: var(--sheet); animation: drop .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.sort-item small { display: block; font-family: var(--font-body); font-size: .95rem; font-weight: 700; color: var(--red); margin-top: 6px; }
.sort-item.go-ok { border-color: var(--ok); background: var(--ok-2); animation: away .38s ease forwards; }
.sort-item.go-ko { border-color: var(--ko); background: var(--ko-2); animation: shake .3s; }
@keyframes drop { from { transform: translateY(-16px) scale(.96); opacity: 0; } }
@keyframes away { to { transform: translateY(40px) scale(.85); opacity: 0; } }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.bin { display: grid; gap: 4px; justify-items: center; border: 2px solid var(--rule-2); border-radius: 16px; background: var(--sheet); padding: 16px 10px; cursor: pointer; font-weight: 700; color: var(--ink); font-size: 1rem; transition: transform .1s, border-color .15s; }
.bin:hover { border-color: var(--blue); background: var(--blue-2); }
.bin:active { transform: scale(.97); }
.bin kbd { font-size: .72rem; }
.bin.ok { border-color: var(--ok); background: var(--ok-2); animation: pop .3s; }
.bin.ko { border-color: var(--ko); background: var(--ko-2); }
.bin.hint { border-color: var(--ok); border-style: dashed; }
.sel-l { display: flex; gap: 10px; align-items: center; margin: 14px 0; font-size: .9rem; color: var(--ink-2); flex-wrap: wrap; }
.jrow { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.jrow:last-of-type { border-bottom: 0; }
.jrow .sels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.jrow.ok > div:first-child b { color: var(--green); }
.jrow.ko > div:first-child b { color: var(--red); }
label.sm { font-size: .8rem; color: var(--ink-3); display: grid; gap: 3px; }
.tf { display: flex; gap: 6px; }
.score-l { font-family: var(--font-display); font-size: 1.6rem; margin-left: 8px; }
@media (max-width: 560px) { .jrow .sels { grid-template-columns: 1fr; } }

/* ---------- Exam ---------- */
.exam-bar { position: sticky; top: 64px; z-index: 30; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; box-shadow: var(--shadow-up); }
.exam-bar small { display: block; color: var(--ink-3); font-size: .8rem; }
.timer { font-family: var(--font-display); font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.timer.late { color: var(--red); animation: pop 1s infinite; }
.exam-past { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.pastc { display: grid; padding: 12px 14px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--rule); font-size: .85rem; color: var(--ink-2); }
.pastc b { font-family: var(--font-display); font-size: 2rem; color: var(--ink); line-height: 1; }
.pastc small { font-size: .5em; color: var(--ink-3); }
.grade { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: 20px 24px; box-shadow: var(--shadow-up); }
.grade-split { display: grid; gap: 8px; }
.grade-split div { display: grid; }
.grade-split b { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; }
.grade-split span { color: var(--ink-2); font-size: .9rem; }
@media (max-width: 860px) { .exam-bar { top: 58px; } }

/* ---------- Toolkit ---------- */
.tk-body { background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 18px; box-shadow: var(--shadow); }
.cheats { columns: 340px 3; column-gap: 14px; }
.cheat { --kc: var(--blue); break-inside: avoid; margin: 0 0 14px; padding: 14px; border-radius: 14px; background: var(--sheet-2); border: 1px solid var(--rule); border-top: 5px solid var(--kc); }
.k-amber { --kc: var(--amber); } .k-green { --kc: var(--green); } .k-plum { --kc: var(--plum); } .k-red { --kc: var(--red); } .k-teal { --kc: var(--teal); }
.cheat h3 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; color: var(--kc); }
.cf { display: grid; gap: 1px; padding: 7px 0; border-top: 1px solid var(--rule); }
.cf span { font-family: var(--font-mono); font-size: .84rem; line-height: 1.45; }
.cf small { color: var(--ink-3); font-size: .8rem; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 18px; margin-top: 12px; }
.gloss div { padding: 8px 2px; border-bottom: 1px solid var(--rule); display: grid; gap: 1px; min-width: 0; }
.gloss span { color: var(--ink-2); font-size: .92rem; }
.gloss .star { color: var(--amber); font-size: .8rem; margin-left: 4px; }
.tree { font-family: var(--font-mono); font-size: .84rem; line-height: 1.7; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.order { list-style: none; counter-reset: o; padding: 0; margin: 0; display: grid; gap: 8px; }
.order li { counter-increment: o; display: grid; grid-template-columns: 38px 1fr; column-gap: 12px; }
.order li::before { content: counter(o); grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--line-b); color: var(--sheet); font-family: var(--font-display); font-weight: 900; font-size: 1.2rem; }
.order span { color: var(--ink-2); }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.vid { display: grid; padding: 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--sheet-2); font-size: .9rem; }
.vid span { color: var(--ink-2); }

/* ---------- Toasts ---------- */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: var(--shadow-up); animation: toastIn .35s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes toastIn { from { transform: translateY(16px) scale(.9); opacity: 0; } }
@media (max-width: 860px) { .toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }

/* ================================================================
   Explainers
   ================================================================ */
/* photo vs movie */
.pvm { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
.photo, .film { position: relative; border-radius: 14px; border: 1px solid var(--rule); padding: 14px; background: var(--sheet-2); transition: opacity .4s; }
.photo.dim { opacity: .45; }
.photo-tag, .film-tag { font-weight: 700; font-size: .85rem; color: var(--ink-2); margin-bottom: 8px; }
.film-strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 120px; padding: 6px; border-radius: 8px; background: var(--ink); }
.frame { position: relative; display: flex; align-items: flex-end; gap: 1px; background: color-mix(in srgb, var(--ink) 80%, var(--bg)); border-radius: 3px; padding: 2px 1px 14px; }
.frame i { flex: 1; height: 0; border-radius: 2px; transition: height .5s ease; }
.film.run .frame i { height: var(--h); }
.frame i.in { background: var(--green); } .frame i.out { background: var(--red); }
.frame span { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; font-size: .6rem; color: var(--bg); opacity: .7; }
.film-total { margin-top: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; }
.film-total .num { color: var(--green); margin-left: 6px; }
.film-arrow { margin-top: 6px; display: inline-block; font-weight: 700; color: var(--green); background: var(--green-2); padding: 3px 10px; border-radius: 99px; animation: rise .4s both; }
@media (max-width: 640px) { .pvm { grid-template-columns: 1fr; } }

/* cash vs profit */
.cvp { display: grid; grid-template-columns: 1fr 190px; gap: 16px; align-items: stretch; }
.cvp-ev { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; align-content: start; }
.cvp-ev li { display: grid; grid-template-columns: 1fr 70px 70px; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 8px; font-size: .86rem; color: var(--ink-3); transition: background .3s, color .3s; }
.cvp-ev li.past { color: var(--ink-2); }
.cvp-ev li.on { background: var(--yellow); color: var(--ink); font-weight: 700; }
.cvp-ev em { font-style: normal; font-family: var(--font-display); font-weight: 800; font-size: .98rem; text-align: right; }
.cvp-ev li:not(.on):not(.past) em { opacity: .3; }
.cvp-ev em.pos { color: var(--green); } .cvp-ev em.posb { color: var(--blue); } .cvp-ev em.neg { color: var(--red); } .cvp-ev em.zero { color: var(--ink-3); }
.cvp-gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gauge { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 2px; }
.gauge b { font-size: .85rem; }
.gauge .num { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; line-height: 1; }
.g-area { position: relative; width: 100%; min-height: 220px; border-radius: 10px; background: var(--sheet-2); border: 1px solid var(--rule); overflow: hidden; }
.g-zero { position: absolute; left: 0; right: 0; height: 2px; background: var(--ink-3); z-index: 1; }
.g-bar { position: absolute; left: 18%; right: 18%; border-radius: 4px; transition: height .6s cubic-bezier(.3, .9, .3, 1), bottom .6s cubic-bezier(.3, .9, .3, 1); }
.g-bar.green { background: var(--green); } .g-bar.blue { background: var(--blue); } .g-bar.red { background: var(--red); }
@media (max-width: 640px) { .cvp { grid-template-columns: 1fr; } .g-area { min-height: 150px; } .cvp-ev li { grid-template-columns: 1fr 58px 58px; font-size: .8rem; } }

/* stock tank */
.tank-wrap { display: grid; grid-template-columns: 1fr minmax(120px, 170px) 1fr; gap: 10px; align-items: center; }
.pipe { display: grid; gap: 2px; padding: 12px; border-radius: 12px; border: 2px dashed var(--rule-2); text-align: center; transition: all .3s; }
.pipe > span { font-size: .86rem; color: var(--ink-2); font-weight: 700; }
.pipe b { font-family: var(--font-display); font-size: 1.6rem; }
.pipe.in.flow { border-style: solid; border-color: var(--green); background: var(--green-2); }
.pipe.out.flow { border-style: solid; border-color: var(--red); background: var(--red-2); }
.pipe.in.flow::after, .pipe.out.flow::after { content: "→"; font-size: 1.4rem; font-weight: 900; animation: nudge .6s infinite alternate; }
.pipe.in.flow::after { color: var(--green); } .pipe.out.flow::after { color: var(--red); }
@keyframes nudge { to { transform: translateX(6px); } }
.tank { position: relative; height: 220px; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 18px 18px; overflow: hidden; background: var(--sheet-2); }
.tank-liquid { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(var(--amber), color-mix(in srgb, var(--amber) 70%, var(--ink))); transition: height .9s cubic-bezier(.3, .9, .3, 1); }
.tank-liquid::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 12px; background: radial-gradient(ellipse at 50% 100%, var(--amber) 60%, transparent 62%) 0 0 / 24px 12px repeat-x; animation: wave 2s linear infinite; }
@keyframes wave { to { background-position-x: 24px; } }
.tank-read { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-family: var(--font-display); font-weight: 900; font-size: 1.9rem; z-index: 1; }
.tank-read small { display: block; font-size: .8rem; font-family: var(--font-body); color: var(--ink-2); font-weight: 700; }
.tank-title { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; white-space: nowrap; font-size: .78rem; font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--sheet) 85%, transparent); padding: 1px 8px; border-radius: 6px; z-index: 1; }
@media (max-width: 560px) { .tank-wrap { grid-template-columns: 1fr 1fr; } .tank { grid-column: 1 / -1; grid-row: 1; height: 180px; } }

/* depreciation */
.dep { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.dep-col { display: grid; gap: 4px; justify-items: stretch; opacity: .25; transition: opacity .4s; }
.dep-col.vis { opacity: 1; }
.dep-area { height: 150px; display: flex; align-items: flex-end; border-bottom: 2px solid var(--ink-3); }
.dep-bv { width: 100%; background: var(--amber-2); border: 2px solid var(--amber); border-bottom: 0; border-radius: 6px 6px 0 0; transition: height .7s cubic-bezier(.3, .9, .3, 1); display: flex; justify-content: center; }
.dep-bv span { font-family: var(--font-display); font-weight: 800; font-size: 1rem; margin-top: 2px; }
.dep-y { text-align: center; font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.dep-chip { text-align: center; font-size: .72rem; border-radius: 6px; padding: 3px 2px; background: var(--grey-2); color: var(--ink-3); white-space: nowrap; }
.dep-chip.charge.on { background: var(--red-2); color: var(--red); font-weight: 700; }
.dep-chip.cash.on { background: var(--blue-2); color: var(--blue); font-weight: 700; }
@media (max-width: 560px) { .dep-chip { font-size: .6rem; } }

/* inventory lots */
.lots { display: grid; grid-template-columns: 200px 1fr; gap: 18px; align-items: end; }
.lots-stack { height: 240px; display: flex; flex-direction: column; justify-content: flex-end; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 12px 12px; overflow: hidden; }
.lot { display: grid; place-items: center; font-size: .8rem; font-weight: 700; text-align: center; transition: height .8s cubic-bezier(.3, .9, .3, 1); overflow: hidden; border-top: 2px solid var(--sheet); }
.lot0 { background: color-mix(in srgb, var(--amber) 45%, var(--sheet)); }
.lot1 { background: color-mix(in srgb, var(--amber) 70%, var(--sheet)); }
.lot2 { background: var(--amber); color: var(--sheet); }
.lots-out { display: grid; gap: 8px; }
.lots-k { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--sheet-2); border: 1px solid var(--rule); }
.lots-k > span { font-size: .88rem; color: var(--ink-2); }
.lots-k b { font-family: var(--font-display); font-size: 1.4rem; }
@media (max-width: 560px) { .lots { grid-template-columns: 1fr; } .lots-stack { height: 180px; } }

/* functional balance sheet */
.fbs { display: grid; grid-template-columns: 1fr 200px; gap: 18px; align-items: center; }
.eqs { display: grid; gap: 8px; }
.eq { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--rule); background: var(--sheet-2); opacity: .4; transition: all .4s; }
.eq.on { opacity: 1; border-color: var(--ink); }
.eq span { font-weight: 700; }
.eq .num { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; }
.eq.res.on { border-color: var(--red); background: var(--red-2); }
@media (max-width: 640px) { .fbs { grid-template-columns: 1fr; } }
.grow-bars { display: grid; gap: 8px; margin-top: 10px; }
.gb { display: grid; grid-template-columns: 80px 1fr 80px; gap: 10px; align-items: center; }
.gb-l { font-weight: 700; }
.gb-t { height: 34px; border-radius: 10px; background: var(--sheet-2); overflow: hidden; }
.gb-t i { display: block; height: 100%; background: var(--c2); border-right: 4px solid var(--c); transition: width .5s cubic-bezier(.3, .9, .3, 1); }
.gb .num { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; text-align: right; }

/* needs and resources */
.nr { display: grid; gap: 12px; }
.nr-rows { display: grid; gap: 4px; }
.nr-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--sheet-2); opacity: .2; transform: translateX(-8px); transition: all .35s; font-size: .92rem; }
.nr-row.vis { opacity: 1; transform: none; }
.nr-row.on { box-shadow: inset 0 0 0 2px var(--ink); }
.nr-ab { color: var(--ink-3); font-size: .85rem; }
.nr-row b { font-size: .85rem; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.nr-row b.need { background: var(--red-2); color: var(--red); } .nr-row b.res { background: var(--green-2); color: var(--green); }
.nr-tot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.nr-pan { display: grid; justify-items: center; padding: 10px; border-radius: 12px; }
.nr-pan.need { background: var(--red-2); } .nr-pan.res { background: var(--green-2); }
.nr-pan > span { font-weight: 700; font-size: .85rem; }
.nr-pan .num { font-family: var(--font-display); font-weight: 900; font-size: 1.8rem; }
.nr-eq { font-family: var(--font-display); font-weight: 900; font-size: 2rem; color: var(--ink-3); }
.nr-eq.on { color: var(--green); animation: pop .5s; }

/* T-accounts */
.taccs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tacc { opacity: .4; transition: opacity .4s, transform .4s; }
.tacc.on { opacity: 1; }
.tacc.now { transform: translateY(-4px); }
.tacc-n { text-align: center; font-weight: 700; padding-bottom: 6px; border-bottom: 3px solid var(--ink); display: grid; }
.tacc-n small { font-weight: 400; color: var(--ink-3); font-size: .75rem; }
.tacc-t { display: grid; grid-template-columns: 1fr 1fr; min-height: 100px; }
.tacc-side { display: grid; align-content: start; justify-items: center; gap: 4px; padding: 6px 2px; }
.tacc-side:first-child { border-right: 3px solid var(--ink); }
.tacc-side small { color: var(--ink-3); font-size: .72rem; }
.chipd, .chipc { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; padding: 2px 10px; border-radius: 8px; animation: drop .4s cubic-bezier(.2, 1.4, .4, 1) both; }
.chipd { background: var(--blue-2); color: var(--blue); } .chipc { background: var(--plum-2); color: var(--plum); }
@media (max-width: 640px) { .taccs { grid-template-columns: 1fr 1fr; } }

/* management cycle */
.cycle { position: relative; aspect-ratio: 300 / 280; max-width: 520px; margin: 0 auto; }
.cycle-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cycle-ring { fill: none; stroke: var(--grey-2); stroke-width: 10; }
.cycle-prog { fill: none; stroke: var(--blue); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.3, .9, .3, 1); }
.cnode { position: absolute; transform: translate(-50%, -50%); width: 33%; max-width: 172px; display: grid; text-align: center; padding: 6px 8px; border-radius: 12px; background: var(--sheet); border: 2px solid var(--rule-2); transition: all .35s; z-index: 1; }
.cnode b { font-size: .8rem; line-height: 1.15; }
.cnode small { font-size: .7rem; color: var(--ink-3); line-height: 1.15; }
.cnode.past { border-color: var(--blue); }
.cnode.on { background: var(--blue); border-color: var(--blue); color: var(--on-blue); transform: translate(-50%, -50%) scale(1.1); }
.cnode.on small { color: inherit; opacity: .85; }
.cnode.back.on { background: var(--red); border-color: var(--red); }
.cycle-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; text-align: center; }
.cycle-mid span { font-family: var(--font-display); font-weight: 900; font-size: 1.7rem; color: var(--blue); }
.cycle-mid small { color: var(--ink-3); font-size: .78rem; max-width: 120px; }
@media (max-width: 560px) { .cnode { width: 34%; padding: 4px; } .cnode b { font-size: .7rem; } .cnode small { display: none; } .cycle-mid span { font-size: 1.2rem; } .cycle-mid small { display: none; } }

/* horizons */
.hz { display: grid; gap: 8px; padding: 6px 0; }
.hz-years { display: grid; grid-template-columns: repeat(5, 1fr); font-size: .8rem; color: var(--ink-3); font-weight: 700; }
.hz-bar { height: 50px; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--sheet); overflow: hidden; white-space: nowrap; transition: width .9s cubic-bezier(.3, .9, .3, 1), transform .4s; opacity: .2; }
.hz-bar.on { opacity: 1; }
.hz-bar b { font-family: var(--font-display); font-size: 1.4rem; }
.hz-bar span { font-size: .85rem; opacity: .9; }
.hz-bar.lt { background: var(--plum); } .hz-bar.mt { background: var(--teal); } .hz-bar.st { background: var(--blue); }
.hz-bar.pop { background: var(--yellow-hi); color: #1A1300; transform: scale(1.05); transform-origin: left; box-shadow: var(--shadow-up); }

/* process */
