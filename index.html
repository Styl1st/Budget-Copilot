/* control timeline */
.ctl { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 30px; }
.ctl-track { position: absolute; left: 16%; right: 16%; top: 10px; height: 6px; border-radius: 3px; background: var(--grey-2); }
.ctl-track i { display: block; height: 100%; background: var(--blue); border-radius: 3px; transition: width .7s; }
.ctl-k { display: grid; justify-items: center; text-align: center; padding: 16px 8px; border-radius: 14px; border: 2px solid var(--rule-2); background: var(--sheet); transition: all .35s; }
.ctl-k b { font-family: var(--font-display); font-size: 1.4rem; }
.ctl-k span { color: var(--ink-3); font-size: .85rem; }
.ctl-k.on { border-color: var(--blue); background: var(--blue-2); transform: translateY(-4px); }
.ctl-k.past { border-color: var(--blue); }
.ctl-action { position: absolute; left: 50%; top: -2px; transform: translateX(-50%); font-size: .75rem; font-weight: 700; background: var(--yellow-hi); color: #1A1300; padding: 0 8px; border-radius: 99px; }

/* variance lab */
.vlab-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(220px, 1fr); gap: 16px; align-items: center; }
.vlab-svg { width: 100%; height: auto; }
.ax { stroke: var(--ink-3); stroke-width: 1.5; }
.tk { fill: var(--ink-2); font-size: 10px; font-family: var(--font-body); }
.r-plan { fill: color-mix(in srgb, var(--grey-c) 30%, transparent); stroke: none; transition: all .4s; }
.r-act { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 3; transition: all .4s; }
.r-q, .r-p { transition: all .4s; }
.r-q.f { fill: color-mix(in srgb, var(--green) 62%, transparent); } .r-p.f { fill: color-mix(in srgb, var(--green) 38%, transparent); }
.r-q.u { fill: color-mix(in srgb, var(--red) 62%, transparent); } .r-p.u { fill: color-mix(in srgb, var(--red) 38%, transparent); }
.r-q, .r-p { stroke: var(--sheet); stroke-width: 1.5; }
.tk.lbl { font-weight: 700; fill: var(--ink); font-size: 11px; }
.vlab-out { display: grid; gap: 5px; }
.vo { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; padding: 7px 11px; border-radius: 10px; background: var(--sheet-2); border-left: 5px solid var(--rule-2); }
.vo > span { font-size: .85rem; color: var(--ink-2); }
.vo b { font-family: var(--font-display); font-size: 1.25rem; text-align: right; white-space: nowrap; }
.vo small { grid-column: 1 / -1; color: var(--ink-3); font-size: .74rem; }
.vo.plan { border-left-color: var(--grey-c); } .vo.act { border-left-color: var(--ink); }
.vo.f { border-left-color: var(--green); } .vo.f b { color: var(--green); }
.vo.u { border-left-color: var(--red); } .vo.u b { color: var(--red); }
.vo.tot { background: var(--ink); } .vo.tot span { color: var(--bg); opacity: .8; } .vo.tot.f b { color: var(--green); } .vo.tot.u b { color: var(--red); }
.vlab-sl { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
@media (max-width: 680px) { .vlab-body, .vlab-sl { grid-template-columns: 1fr; } }

/* leverage */
.lev-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.lev-body { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(200px, 1fr); gap: 16px; align-items: center; }
.lev-svg { width: 100%; height: auto; }
.lev-line { stroke: var(--ink-3); stroke-width: 4; stroke-linecap: round; transition: all .4s; }
.lev-line.good { stroke: var(--green); } .lev-line.bad { stroke: var(--red); }
.lev-dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 3; transition: all .3s; }
.lev-dot.good { fill: var(--green); } .lev-dot.bad { fill: var(--red); }
.lev-roe { display: grid; padding: 12px 16px; border-radius: 14px; background: var(--sheet-2); border: 2px solid var(--rule-2); }
.lev-roe.good { border-color: var(--green); } .lev-roe.bad { border-color: var(--red); }
.lev-roe > span { font-size: .85rem; font-weight: 700; color: var(--ink-2); }
.lev-roe b { font-family: var(--font-display); font-size: 2.8rem; font-weight: 900; line-height: 1; }
.lev-roe.good b { color: var(--green); } .lev-roe.bad b { color: var(--red); }
.lev-out p { margin: 10px 0 0; font-size: .95rem; }
.lev-sl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 10px; }
@media (max-width: 680px) { .lev-body, .lev-sl { grid-template-columns: 1fr; } }

/* operating cycle */
.ocy { display: grid; gap: 8px; }
.ocy-bar { display: flex; height: 50px; gap: 2px; }
.ocy-bar i { display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 8px; background: var(--c2); border: 2px solid var(--c); opacity: .12; transition: opacity .45s, transform .45s; font-style: normal; overflow: hidden; }
.ocy-bar i.on { opacity: 1; }
.ocy-bar i.blank { background: none; border: 0; }
.ocy-bar span { font-size: .8rem; font-weight: 700; line-height: 1.15; padding: 0 4px; }
.ocy-bar small { display: block; font-weight: 400; color: var(--ink-2); }
.ocy-scale { display: flex; justify-content: space-between; font-size: .78rem; color: var(--ink-3); border-top: 2px solid var(--ink-3); padding-top: 4px; }
@media (max-width: 560px) { .ocy-bar span { font-size: .64rem; } }

/* normative WCR */
.nwcr { display: grid; gap: 10px; }
.nw-day { display: flex; gap: 10px; align-items: baseline; }
.nw-day > span { font-weight: 700; color: var(--ink-2); }
.nw-day b { font-family: var(--font-display); font-size: 1.8rem; }
.nw-bar { display: flex; height: 48px; background: var(--sheet-2); border-radius: 10px; overflow: hidden; }
.nw-bar i { display: flex; align-items: center; justify-content: center; background: var(--c2); border-right: 3px solid var(--c); font-style: normal; transition: width .7s cubic-bezier(.3, .9, .3, 1); overflow: hidden; white-space: nowrap; }
.nw-bar i.blank { background: none; border: 0; }
.nw-bar span { font-size: .78rem; font-weight: 700; padding: 0 6px; }
.nw-res { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); opacity: .15; transition: opacity .5s; }
.nw-res.on { opacity: 1; }
.nw-res b { font-family: var(--font-display); font-size: 1.8rem; }

/* small visuals */
.prule { display: grid; gap: 8px; }
.pr { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; }
.pr span { font-weight: 700; font-size: .92rem; }
.pr-t { height: 22px; background: var(--sheet-2); border-radius: 6px; overflow: hidden; }
.pr-t i { display: block; height: 100%; background: var(--c); animation: growx .9s cubic-bezier(.3, .9, .3, 1) both; transform-origin: left; }
@keyframes growx { from { transform: scaleX(0); } }
.pr b { font-family: var(--font-display); font-size: 1.3rem; text-align: right; }
.itypes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.it-col { display: grid; gap: 6px; align-content: start; }
.it-col b { font-family: var(--font-display); font-size: 1.4rem; }
.it-col span { padding: 7px 10px; border-radius: 10px; background: var(--sheet-2); border: 1px solid var(--rule); font-size: .86rem; animation: rise .4s both; }
@media (max-width: 640px) { .itypes { grid-template-columns: 1fr; } }
.recipe { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; position: relative; }
.recipe::before { content: ""; position: absolute; left: 19px; top: 18px; bottom: 18px; width: 6px; border-radius: 3px; background: var(--line-b); }
.recipe li { position: relative; display: grid; grid-template-columns: 44px 1fr; column-gap: 12px; align-items: center; animation: rise .45s both; }
.recipe i { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; background: var(--sheet); border: 5px solid var(--line-b); color: var(--line-b); }
.recipe b { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.recipe span { color: var(--ink-2); font-size: .94rem; }
.traps { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.trapc { position: relative; min-height: 96px; border: 2px solid var(--red); border-radius: 14px; background: var(--red-2); cursor: pointer; padding: 12px; text-align: left; overflow: hidden; }
.tr-f { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; color: var(--red); display: block; transition: opacity .25s, transform .25s; }
.tr-b { position: absolute; inset: 0; padding: 12px; display: grid; align-items: center; background: var(--green-2); color: var(--ink); font-size: .92rem; font-weight: 700; opacity: 0; transform: translateY(20px); transition: all .3s cubic-bezier(.2, 1.2, .4, 1); }
.trapc.open { border-color: var(--green); }
.trapc.open .tr-b { opacity: 1; transform: none; }
.trapc.open .tr-f { opacity: 0; }
.signr { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sr-col { display: grid; gap: 6px; }
.sr-col > b { font-family: var(--font-display); font-size: 1.6rem; }
.sr-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 12px; font-weight: 700; }
.sr-row em { font-style: normal; font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; }
.sr-row.f { background: var(--green-2); } .sr-row.f em { color: var(--green); }
.sr-row.u { background: var(--red-2); } .sr-row.u em { color: var(--red); }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.why-t { display: grid; gap: 4px; padding: 14px; border-radius: 14px; background: var(--sheet-2); border: 1px solid var(--rule); animation: rise .45s both; }
.why-t b { font-family: var(--font-display); font-size: 1.5rem; color: var(--blue); }
.why-t span { font-size: .9rem; color: var(--ink-2); }
.nest-o { padding: 18px; border-radius: 18px; background: var(--plum-2); border: 2px solid var(--plum); display: grid; gap: 4px; }
.nest-o > b { font-family: var(--font-display); font-size: 1.7rem; color: var(--plum); }
.nest-i { margin-top: 12px; padding: 16px; border-radius: 14px; background: var(--blue-2); border: 2px solid var(--blue); display: grid; max-width: 360px; animation: rise .5s .2s both; }
.nest-i b { font-family: var(--font-display); font-size: 1.4rem; color: var(--blue); }
.quote { margin: 0; padding: 18px 20px; border-left: 6px solid var(--blue); background: var(--blue-2); border-radius: 0 14px 14px 0; font-size: 1.05rem; line-height: 1.55; }

/* spreadsheet host */
.sheet-host { min-width: 0; }
.xl-keys-note { font-size: .82rem; color: var(--ink-2); margin: 10px 0 0; }
.xl-actions .btn { font-size: .86rem; padding: 6px 11px; box-shadow: none; }
.xl-actions .btn-primary { box-shadow: 0 2px 0 color-mix(in srgb, var(--blue) 55%, var(--ink)); }

/* ---------- Videos ---------- */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 16px; }
.vrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .vrow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini-vids { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; text-align: left; }
.vcard { display: grid; gap: 10px; text-decoration: none; color: var(--ink); }
.vthumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: var(--sheet-2); border: 1px solid var(--rule); box-shadow: var(--shadow); }
.vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
.vcard:hover .vthumb img { transform: scale(1.04); }
.vplay { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: var(--on-blue); box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .5); transition: transform .2s; padding-left: 3px; }
.vcard:hover .vplay { transform: scale(1.12); }
.vcard.small .vplay { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
.vdur, .vseen { position: absolute; bottom: 8px; font-style: normal; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
.vdur { right: 8px; background: rgba(10, 15, 30, .82); color: #fff; }
.vseen { left: 8px; background: var(--green); color: #fff; }
.vmeta { display: grid; gap: 2px; }
.vmeta small { color: var(--blue); font-weight: 700; font-size: .82rem; }
.vmeta b { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.1; }
.vcard.small .vmeta b { font-size: 1.15rem; }
.vitems { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.vitems i { font-style: normal; font-size: .8rem; padding: 2px 9px; border-radius: 99px; background: var(--sheet); border: 1px solid var(--rule); color: var(--ink-2); }
.vpage { max-width: 1320px; }
.vhead { margin: 4px 0 14px; }
.vhead small { color: var(--blue); font-weight: 700; }
.vhead h1 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 0; }
.vlayout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.vframe { border-radius: 16px; overflow: hidden; background: #0A0F1E; box-shadow: var(--shadow-up); aspect-ratio: 16 / 9; }
.vframe video { width: 100%; height: 100%; display: block; background: #0A0F1E; }
.vbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.vbar .seg { margin: 0; }
.vdo h3 { margin-bottom: 4px; }
.vtake { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.vtake li { padding-left: 22px; position: relative; color: var(--ink-2); font-size: .94rem; }
.vtake li::before { content: "✓"; position: absolute; left: 2px; color: var(--green); font-weight: 900; }
.vside { display: grid; gap: 12px; position: sticky; top: 76px; }
.vch, .vline { display: grid; grid-template-columns: 46px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-size: .9rem; line-height: 1.35; }
.vch em, .vline em { font-style: normal; font-family: var(--font-mono); font-size: .78rem; color: var(--ink-3); padding-top: 2px; }
.vch:hover, .vline:hover { background: var(--sheet-2); }
.vch.on { background: var(--blue); color: var(--on-blue); font-weight: 700; }
.vch.on em { color: inherit; opacity: .8; }
.vline.past { color: var(--ink-3); }
.vline.on { background: var(--yellow); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--yellow-2); }
.vlines { max-height: 440px; overflow-y: auto; position: relative; margin: 0 -6px; padding: 0 6px; overscroll-behavior: contain; }
@media (max-width: 1000px) { .vlayout { grid-template-columns: 1fr; } .vside { position: static; } .vlines { max-height: 320px; } }
.btn-watch { background: var(--yellow-hi); border-color: var(--yellow-2); color: #1A1300; font-weight: 700; }
.watchp { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); padding: 10px; }
.watchp img { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; }
.watchp span { display: grid; }
.watchp b { font-size: .95rem; }
.watchp small { color: var(--ink-3); font-size: .8rem; }
.watchp:hover { border-color: var(--blue); }
.ctas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.exam-cta.vid { background: var(--blue); color: var(--on-blue); }
.exam-cta.vid svg { color: var(--yellow-hi); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---------- Tableur ---------- */
.xl { background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); position: relative; }
.xl.shake { animation: shake .28s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.xl-bar { display: flex; align-items: stretch; border-bottom: 1px solid var(--rule); background: var(--sheet-2); }
.xl-name { width: 92px; flex: none; font-family: var(--font-mono); font-size: .86rem; padding: 7px 8px; border-right: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xl-fx { flex: none; padding: 6px 10px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; color: var(--ink-3); border-right: 1px solid var(--rule); }
.xl-formula { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: .9rem; padding: 7px 10px; outline: none; }
.xl-formula:focus { background: var(--sheet); box-shadow: inset 0 -2px 0 var(--blue); }
.xl-formula[readonly] { color: var(--ink-3); }
.xl-scroll { overflow: auto; max-height: min(68vh, 760px); outline: none; position: relative; overscroll-behavior: contain; }
.xl.is-focus .xl-scroll { box-shadow: inset 0 0 0 1px var(--rule-2); }
.xl-wrap { position: relative; width: max-content; }
.xl-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: .9rem; user-select: none; -webkit-user-select: none; }
.xl-grid th { position: sticky; z-index: 3; background: var(--grid-head); color: var(--ink-3); font-family: var(--font-mono); font-weight: 400; font-size: .76rem; border-right: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); }
.xl-grid thead th { top: 0; height: 24px; }
.xl-grid th.xl-corner { left: 0; z-index: 5; width: 42px; min-width: 42px; }
.xl-grid th.xl-rh { left: 0; width: 42px; min-width: 42px; text-align: center; z-index: 4; }
.xl-grid th.on { background: var(--blue-2); color: var(--blue); font-weight: 700; }
.xl-grid th.xl-ch.frz { left: 42px; z-index: 4; }
.xl-grid td[data-frz] { position: sticky; left: 42px; z-index: 1; box-shadow: 1px 0 0 var(--rule-2); }
@media (max-width: 700px) {
  .xl-grid td[data-frz] { position: relative; left: auto; z-index: auto; box-shadow: none; }
  .xl-grid th.xl-ch.frz { left: auto; z-index: 3; }
  .xl-grid td.label .xl-v, .xl-grid td.sub .xl-v, .xl-grid td.total .xl-v { text-overflow: ellipsis; }
}
.xl-grid td { height: 28px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0; background: var(--sheet); position: relative; cursor: cell; }
.xl-grid td .xl-v { pointer-events: none; padding: 0 7px; line-height: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 27px; }
.xl-grid td.num .xl-v { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: .86rem; }
.xl-grid td.neg .xl-v { color: var(--red); }
.xl-grid td.err .xl-v { color: var(--red); font-family: var(--font-mono); font-size: .8rem; text-align: center; }
.xl-grid td.label .xl-v, .xl-grid td.sub .xl-v, .xl-grid td.total .xl-v, .xl-grid td.note .xl-v, .xl-grid td.qlabel .xl-v { overflow: visible; position: relative; z-index: 1; }
.xl-grid td.head .xl-v { overflow: visible; position: relative; z-index: 1; font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; color: var(--blue); }
.xl-grid td.colhead { background: var(--grid-head); }
.xl-grid td.colhead .xl-v { font-family: var(--font-mono); font-size: .76rem; font-weight: 600; color: var(--ink-2); text-align: center; letter-spacing: .02em; }
.xl-grid td.total .xl-v { font-weight: 700; }
.xl-grid td.sub .xl-v { padding-left: 20px; }
.xl-grid td.note .xl-v { color: var(--ink-3); font-style: italic; font-size: .84rem; }
.xl-grid td.given { background: var(--given); }
.xl-grid td.given .xl-v { color: var(--ink); }
.xl-grid td.calc { background: var(--given); }
.xl-grid td.input { background: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow-2); }
.xl-grid td.free { background: var(--yellow); }
.xl-grid td.typed .xl-v { color: var(--blue); }
.xl-grid td.typed.neg .xl-v { color: var(--red); }
.xl-grid td.fx .xl-v { color: var(--ink); }
.xl-grid td.fx.neg .xl-v { color: var(--red); }
.xl-grid td.showf .xl-v { font-family: var(--font-mono); font-size: .76rem; color: var(--ink-2); text-align: left; }
.xl-grid td.mark-ok { background: var(--ok-2); box-shadow: inset 0 0 0 1.5px var(--ok); }
.xl-grid td.mark-ko { background: var(--ko-2); box-shadow: inset 0 0 0 1.5px var(--ko); }
.xl-grid td.mark-ok::after, .xl-grid td.mark-ko::after { position: absolute; left: 3px; top: 1px; font-size: .7rem; font-weight: 800; z-index: 2; }
.xl-grid td.mark-ok::after { content: "✓"; color: var(--ok); }
.xl-grid td.mark-ko::after { content: "✗"; color: var(--ko); }
.xl-grid td.clip .xl-v { overflow: hidden !important; }
.xl-grid td.has-hint::before { content: ""; position: absolute; right: 0; top: 0; border: 5px solid transparent; border-top-color: var(--blue); border-right-color: var(--blue); }
.xl-sel { position: absolute; border: 2px solid var(--sel); background: color-mix(in srgb, var(--sel) 8%, transparent); pointer-events: none; z-index: 2; margin: -1px 0 0 -1px; }
.xl-handle { position: absolute; width: 9px; height: 9px; background: var(--sel); border: 1.5px solid var(--sheet); z-index: 2; cursor: crosshair; touch-action: none; }
.xl-fillbox { position: absolute; border: 2px dashed var(--ink-3); pointer-events: none; z-index: 2; margin: -1px 0 0 -1px; }
.xl-copybox { position: absolute; pointer-events: none; z-index: 2; margin: -1px 0 0 -1px; border: 2px dashed var(--blue); animation: ants 1s linear infinite; }
@keyframes ants { 50% { border-color: var(--ink-3); } }
.xl-pointbox { position: absolute; pointer-events: none; z-index: 2; margin: -1px 0 0 -1px; border: 2px dashed var(--blue); background: color-mix(in srgb, var(--blue) 10%, transparent); }
.xl-editor { position: absolute; z-index: 9; border: 2px solid var(--sel); background: var(--sheet); color: var(--ink); font-family: var(--font-mono); font-size: .88rem; padding: 0 6px; outline: none; margin: -1px 0 0 -1px; box-shadow: var(--shadow); }
.xl-fillbox[hidden], .xl-copybox[hidden], .xl-pointbox[hidden], .xl-editor[hidden], .xl-handle[hidden] { display: none !important; }
.xl-stamp { position: absolute; z-index: 20; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; letter-spacing: .08em; padding: 4px 18px; border: 4px double currentColor; border-radius: 10px; transform: rotate(-8deg); animation: stamp .35s cubic-bezier(.2, 1.6, .4, 1); background: color-mix(in srgb, var(--sheet) 70%, transparent); }
.xl-stamp.stamp-ok { color: var(--ok); }
.xl-stamp.stamp-ko { color: var(--ko); }
.xl-stamp.stamp-grey { color: var(--ink-3); }
@keyframes stamp { from { transform: rotate(-8deg) scale(2.2); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
.xl-status { display: flex; gap: 14px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--rule); background: var(--sheet-2); font-size: .8rem; min-height: 30px; flex-wrap: wrap; }
.xl-mode { font-family: var(--font-mono); color: var(--blue); font-weight: 700; min-width: 64px; }
.xl-msg { flex: 1; color: var(--ink-2); min-width: 0; }
.xl-stats { font-family: var(--font-mono); color: var(--ink-2); white-space: pre; }
.xl-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; border-top: 1px solid var(--rule); align-items: center; }
.xl-score { margin-left: auto; font-family: var(--font-mono); font-weight: 700; font-size: .9rem; }
.xl-score.good { color: var(--ok); } .xl-score.mid { color: var(--yellow-ink); } .xl-score.low { color: var(--ko); }
.xl-confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 10px 10px; padding: 10px 12px; border-radius: 8px; background: var(--red-2); border: 1px solid var(--red); font-size: .9rem; }
.xl-confirm span { flex: 1 1 220px; }
.xl-keys { margin: 0 10px 12px; padding: 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet-2); }
.xl-keys-grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: .86rem; align-items: baseline; }

    renderSel() {

    }

    /* ---------------- Rendu des cellules ---------------- */
    render() {

      this.renderSel();
    }
    renderCell(c, r) {
      const td = this.tds[r][c];
      const x = this.m.cell(c, r);
      const div = td.firstChild;
      let cls = '';
      let txt = '';
      if (x) {
        cls = x.cls || '';
        const raw = x.raw ?? '';
        const cl = x.text ? { kind: 'text' } : F.classify(raw);

          txt = F.format(v, x.fmt);

      td.className = cls.trim();

    }

    updateStatus() {
      const modes = { enter: 'Enter', edit: 'Edit', point: 'Point' };
      let mode = 'Ready';

      this.modeEl.textContent = mode;
      const r = this.range();
      const { ac, ar } = this.sel;
      const x = this.m.cell(ac, ar);
      let msg = '';

      else if (x && this.hintsOn && x.hint) msg = 'Hint: ' + x.hint;

          if (v !== null && v !== '') cnt++;
          if (typeof v === 'number') { s += v; n++; }
        }
        this.statsEl.textContent = n ? 'Average: ' + F.fmtNum(s / n, 2) + '   Count: ' + cnt + '   Sum: ' + F.fmtNum(s, 2) : (cnt ? 'Count: ' + cnt : '');
      } else this.statsEl.textContent = '';
    }
    flash(msg) {
      this._flash = msg;

      clearTimeout(this._flashT);

    }

    /* ---------------- Édition ---------------- */
    startEdit(mode, initial, viaBar) {

    pointAt(c1, r1, c2, r2, fresh) {

    commit() {

    }

    /* ---------------- Changements + annulation ---------------- */
    applyChanges(list, opts) {

    /* ---------------- Navigation clavier ---------------- */
    move(dc, dr) {
      const c = this.sel.ac + dc, r = this.sel.ar + dr;
      this.setSel(c, r, c, r);
    }
    jump(c, r, dc, dr) {
      // Ctrl+flèche : bord du bloc de données

      } else {

    }
    onGridKey(e) {

      if (k.startsWith('Arrow')) {
        e.preventDefault();
        const dc = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0;
        const dr = k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0;
        if (e.shiftKey) {

        } else {
          const p = ctrl ? this.jump(s.ac, s.ar, dc, dr) : { c: s.ac + dc, r: s.ar + dr };

        if (kl === 'a') { e.preventDefault(); this.setSel(0, 0, this.m.nCols - 1, this.m.nRows - 1); return; }

    }
    lastUsed() {

      return { c: mc, r: mr };
    }
    clearSel() {
      const r = this.range(); const ch = [];

    /* ---------------- Copier / coller ---------------- */
    copy(cut) {

    }
    onPaste(e) {

    pasteInternal() {

    }

    /* ---------------- Recopie ---------------- */
    fillDir(dir) {

    rm: 60, dl: 40, dep: 3000, invest: 20000, investQ: 1, otherWages: 1250, external: 450, financial: 300,

  };

  /* ---------- Générateur de cas aléatoires ---------- */
  function rng(seed) {
    let a = seed >>> 0;
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const NAMES = ['NOVA', 'KERAN', 'BLUEFIN', 'ALTO', 'MISTRAL', 'ORBIS', 'VELA', 'PIXELIA', 'CORVUS', 'LUMEN', 'TALOS', 'HELIX'];
  const PRODUCTS = ['electric scooters', 'drones', 'espresso machines', 'smart locks', 'e-bikes', 'solar panels', 'gaming chairs', 'industrial sensors', 'snowboards', '3D printers'];
  function randomParams(seed) {
    for (let tries = 0; tries < 50; tries++) {
      const R = rng(seed + tries * 7919);
      const pick = arr => arr[Math.floor(R() * arr.length)];
      const between = (a, b, step) => a + step * Math.floor(R() * ((b - a) / step + 1));
      const price = between(800, 2400, 50);
      const rm = Math.round(price * (0.38 + R() * 0.10) / 10) * 10;
      const dl = Math.round(price * (0.20 + R() * 0.08) / 10) * 10;
      const qtySold = between(1500, 5000, 100);
      const sK = qtySold * price / 1000;
      const fgOpenQty = between(200, 700, 50);
      const fgChange = pick([-100, -50, 0, 50, 100]);
      const dep = Math.round(sK * (0.04 + R() * 0.03) / 10) * 10;
      const fgOpenCost = Math.round((rm + dl + dep * 1000 / qtySold) * (0.95 + R() * 0.07) / 10) * 10;
      const invest = Math.max(100, Math.round(sK * (0.06 + R() * 0.10) / 50) * 50);
      const otherWages = Math.round(sK * (0.08 + R() * 0.04) / 10) * 10;
      const external = Math.round(sK * (0.05 + R() * 0.03) / 2) * 2;
      const financial = Math.max(20, Math.round(sK * (0.015 + R() * 0.015) / 10) * 10);
      const taxRate = pick([0.25, 0.25, 0.34]);
      const custDays = pick([30, 60, 90, 90]);
      const suppDays = pick([30, 60, 90]);
      const salesK = qtySold * price / 1000;
      const prevSales = salesK / pick([1.1, 1.2, 1.3, 1.5]);
      const rmInv = between(100, 400, 10);
      const receivables = Math.round(prevSales * custDays / 360);
      const payables = Math.round(prevSales * rm / price * suppDays / 360);
      const grossFA = between(800, 2400, 50);
      const accDep = Math.round(grossFA * (0.3 + R() * 0.3) / 10) * 10;
      const fgK = fgOpenQty * fgOpenCost / 1000;
      const assets = grossFA - accDep + rmInv + fgK + receivables;
      const mtDebt = Math.round(assets * (0.1 + R() * 0.15) / 10) * 10;
      let overdraft = between(200, 900, 10);
      let equity = assets - mtDebt - payables - overdraft;
      if (equity < assets * 0.25) { overdraft = Math.max(50, Math.round((assets - mtDebt - payables - assets * 0.3) / 10) * 10); equity = assets - mtDebt - payables - overdraft; }
      if (overdraft < 50 || equity <= 0) continue;
      const profit = Math.round(equity * (0.08 + R() * 0.08));
      const capital = Math.round(equity * 0.45 / 10) * 10;
      const reserves = Math.round((equity - profit - capital) * 100) / 100;
      const P = {
        div: 1000, qtySold, price, fgOpenQty, fgOpenCost, fgChange, rm, dl, dep, invest, investQ: pick([1, 1, 2]), otherWages, external, financial,
        taxRate, taxQ: 4, custDays, suppDays, authorized: overdraft,
        open: { grossFA, accDep, rmInv, receivables, cash: 0, capital, reserves, profit, mtDebt, payables, overdraft },
        name: pick(NAMES), product: pick(PRODUCTS), seed
      };
      const Rr = computeBudget(P);
      if (Rr.pbt <= 20 || Rr.prodQty <= 0 || Rr.fgEndQty < 0) continue;
      return P;
    }
    return Object.assign({}, FLAX, { name: 'FLAX', product: 'units', seed });
  }

  function statementFor(P, title) {

  function racolSteps() {
    const base = (G) => {
      G.add(['c:Data (K€)', 'c:Value']);
      G.add(['Selling price per car', g(50, 'p')]);
      G.add(['Special order price (−10 %)', g(45, 'sp')]);
      G.add(['Raw materials per car', g(20, 'rm')]);
      G.add(['Cost of one worker per year', g(30, 'w')]);
      G.add(['Workers per production line', g(10, 'wl')]);
      G.add(['Depreciation per line (1 000 / 5 years)', g(200, 'dl')]);
      G.add(['Overheads (fixed)', g(560, 'oh')]);
      G.gap();
    };
    const scen = [
      { name: 'Growth: market 60 cars', mk: 60 },
      { name: 'Recession: market 20 cars', mk: 20 },
      { name: 'Stagnation: market 40 cars', mk: 40 }
    ];
    const steps = [];
    const results = [];
    scen.forEach((s, si) => {
      const G = new Grid([270, 136, 136, 136, 136]);
      G.add(['h:' + s.name]);
      base(G);
      const cols = [{ inv: 1, ord: 1 }, { inv: 1, ord: 0 }, { inv: 0, ord: 1 }, { inv: 0, ord: 0 }];
      G.add(['c:Assumption', 'c:Invest + order', 'c:Invest, no order', 'c:No invest + order', 'c:No invest, no order']);
      G.add(['Production lines'].concat(cols.map((c, i) => g(c.inv ? 2 : 1, 'l' + i))));
      G.add(['Capacity (cars)'].concat(cols.map((c, i) => g(c.inv ? 80 : 40, 'cap' + i))));
      G.add(['Market demand (cars)'].concat(cols.map((c, i) => g(s.mk, 'mk' + i))));
      G.add(['Special order accepted? (1 = yes)'].concat(cols.map((c, i) => g(c.ord, 'o' + i))));
      G.add(['c:To complete']);
      const vals = cols.map(c => {
        const cap = c.inv ? 80 : 40;
        const emir = c.ord ? 20 : 0;
        const market = Math.min(s.mk, cap - emir);
        const cars = market + emir;
        const sales = market * 50 + emir * 45;
        const rm = cars * 20, wg = (c.inv ? 2 : 1) * 300, dep = (c.inv ? 2 : 1) * 200, oh = 560;
        const tot = rm + wg + dep + oh;
        return { emir, market, cars, sales, rm, wg, dep, oh, tot, pr: sales - tot, mg: (sales - tot) / sales };
      });
      results.push(vals);
      G.add(['Cars sold to the emir'].concat(vals.map((v, i) => A(v.emir, '={o' + i + '}*20', i === 0 ? '20 cars if the order is accepted.' : '', { name: 'e' + i }))));
      G.add(['Cars sold on the market'].concat(vals.map((v, i) => A(v.market, '=MIN({mk' + i + '},{cap' + i + '}-{e' + i + '})', i === 0 ? 'Market demand, capped by the capacity left after the emir’s order.' : '', { name: 'm' + i }))));
      G.add(['t:Cars produced'].concat(vals.map((v, i) => A(v.cars, '={e' + i + '}+{m' + i + '}', '', { name: 'c' + i }))));
      G.add(['Sales turnover'].concat(vals.map((v, i) => A(v.sales, '={m' + i + '}*{p}+{e' + i + '}*{sp}', i === 0 ? 'Market at 50, emir at 45.' : '', { name: 's' + i }))));
      G.add(['Raw materials'].concat(vals.map((v, i) => A(v.rm, '={c' + i + '}*{rm}', '', { name: 'x' + i }))));
      G.add(['Wages'].concat(vals.map((v, i) => A(v.wg, '={l' + i + '}*{wl}*{w}', i === 0 ? '10 workers per line × 30.' : ''))));
      G.add(['Depreciation'].concat(vals.map((v, i) => A(v.dep, '={l' + i + '}*{dl}', i === 0 ? '200 per line.' : ''))));
      G.add(['Overheads'].concat(vals.map((v, i) => A(v.oh, '={oh}', '', { name: 'y' + i }))));
      G.add(['t:Total expenses'].concat(vals.map((v, i) => A(v.tot, '=SUM({x' + i + '}:{y' + i + '})', '', { name: 't' + i }))));
      G.add(['t:PROFIT OR LOSS'].concat(vals.map((v, i) => A(v.pr, '={s' + i + '}-{t' + i + '}', '', { name: 'r' + i }))));
      G.add(['Net margin (profit ÷ sales)'].concat(vals.map((v, i) => A(v.mg, '={r' + i + '}/{s' + i + '}', '', { fmt: 'pct1', tol: 0.002 }))));
      steps.push({ title: s.name.split(':')[0], tab: ['Growth', 'Recession', 'Stagnation'][si], intro: si === 0 ? '<p><b>Demand</b> scenario × <b>invest or not</b> (2 lines = 80 cars, 20 workers) × <b>accept the emir’s order or not</b> (20 cars at −10 %). One mini P&L per column.</p>' : '<p>Same logic, different market demand.</p>', sheet: G.done() });
    });
    // synthèse
    const G = new Grid([300, 136, 136, 136, 136]);
    G.add(['h:Synthesis · profit (K€) by decision and scenario']);
    G.add(['c:Scenario', 'c:Invest + order', 'c:Invest, no order', 'c:No invest + order', 'c:No invest, no order']);
    ['Growth', 'Recession', 'Stagnation'].forEach((nm, si) => G.add([nm].concat(results[si].map((v, i) => g(v.pr, 'p' + si + i)))));
    G.add(['c:To complete']);
    const avg = [0, 1, 2, 3].map(i => (results[0][i].pr + results[1][i].pr + results[2][i].pr) / 3);
    const mn = [0, 1, 2, 3].map(i => Math.min(results[0][i].pr, results[1][i].pr, results[2][i].pr));
    const mx = [0, 1, 2, 3].map(i => Math.max(results[0][i].pr, results[1][i].pr, results[2][i].pr));
    G.add(['Average profit (3 scenarios equally likely)'].concat(avg.map((v, i) => A(v, '=AVERAGE({p0' + i + '},{p1' + i + '},{p2' + i + '})', i === 0 ? 'Average of the 3 scenarios.' : '', { tol: 0.6 }))));
    G.add(['Worst case (minimum)'].concat(mn.map((v, i) => A(v, '=MIN({p0' + i + '},{p1' + i + '},{p2' + i + '})', i === 0 ? 'Prudent rule (maximin): pick the best of the worst cases.' : ''))));
    G.add(['Best case (maximum)'].concat(mx.map((v, i) => A(v, '=MAX({p0' + i + '},{p1' + i + '},{p2' + i + '})', i === 0 ? 'Optimistic rule (maximax).' : ''))));
    G.gap();
    G.add(['n:Reading: invest + order has the best average (140) but loses 460 in a recession; no invest + order guarantees +40 in every case.']);
    steps.push({ title: 'Synthesis and decision', tab: 'Decision', intro: '<p>With no probabilities, compare decisions on the <b>average</b>, the <b>worst case</b> (prudence) and the <b>best case</b>.</p>', sheet: G.done() });
    return steps;
  }

  function teauSteps() {

    briolet: `<h4>BRIOLET CASE</h4><p>Briolet makes Briolet rollers (factory in Lisbon) and is the exclusive French agent for the American Rol Am rollers. Head office in Paris, showroom and sales office in Vincennes. Prepare: 1) one income statement for all activities, 2) one per profit centre (Production, Sales) with head-office expenses split 50/50, 3) one per product with head-office and Vincennes structure costs split according to sales. Figures in M€, rounded to the million. Paris head office 1 000; Lisbon: RM purchases 1 800, personnel 400, production transferred 2 800; Vincennes: structure 300, Rol Am purchases 1 600, sellers’ commission 10 % of sales, royalty 20 % of Rol Am sales, sales of Briolet 3 700 and Rol Am 3 800. No VAT, no profit tax.</p>`,

 prices, so it must cut costs through productivity."},{ch:"policy",q:"Why is the budget process called iterative?",o:["Because it is repeated every month","Because financing choices change financial expenses and depreciation, which change the result and the resources\u2026","Because managers vote several times","Because actuals are compared four times a year"],a:1,e:"Investments change depreciation, overdrafts change financial fees, so the result changes, so resources change: you loop until it is coherent."},{ch:"policy",q:"The three main steps of the budget allocation process are\u2026",o:["Forecast, invest, control","Goals by top management, simulation by operational managers, negotiation and final target setting","Sales, production, cash","A priori, operational, a posteriori control"],a:1,e:"Part I wrap-up: goals, simulation, negotiation and consolidation."},{ch:"sales",q:"Sales were 100 units. Market +3 %, market share from 20 % to 21 %. Sales target?",o:["104","108","105","123"],a:1,e:"100 \xD7 1.03 \xD7 (21 \xF7 20) = 108.15 \u2192 108. Multiply the coefficients, never add the percentages."},{ch:"sales",q:"Granting longer payment terms to customers is equivalent to\u2026",o:["Increasing the sales price","Lending money to customers, which increases the WCR","Reducing the WCR","Increasing the contribution margin"],a:1,e:"Payment time is credit: receivables grow, so does the WCR, and it has to be financed."},{ch:"sales",q:"Contribution margin of the sales department = \u2026",o:["Sales \u2212 variable costs","Sales \u2212 variable costs \u2212 marketing structure costs","Sales \u2212 all costs of the firm","Gross margin + structure costs"],a:1,e:"Sales \u2212 variable costs = gross margin; minus specific structure costs = contribution margin."},{ch:"sales",q:"Industrialists tend to raise their prices by about\u2026",o:["The full inflation rate","75 % of the estimated inflation rate","Twice the inflation rate","Nothing, prices are frozen"],a:1,e:"Productivity gains let industry pass on about 75 % of inflation; services pass on all of it."},{ch:"sales",q:"BILLOT: average Q1 over two years = 330, average of the 8 quarters = 432. The seasonal coefficient of Q1 is\u2026",o:["0.19","0.76","1.31","330"],a:1,e:"330 \xF7 432 = 0.764. Q1 sales = (annual volume \xF7 4) \xD7 0.764."},{ch:"production",q:"Production volume = \u2026",o:["Sales + opening inventory \u2212 closing inventory","Sales \u2212 opening FG inventory + closing FG inventory","Purchases \u2212 sales","Sales \xD7 unit cost"],a:1,e:"Produce what you sell, minus what you already hold, plus what you want to keep."},{ch:"production",q:"FLAX sells 3 100 units, opening FG 500, management wants to cut FG stock by 100. Production?",o:["3 100","3 000","3 200","3 600"],a:1,e:"3 100 \u2212 500 + 400 = 3 000."},{ch:"production",q:"Standard raw material cost per product = \u2026",o:["Standard price \xD7 actual quantity","(Standard purchase price + standard added costs) \xD7 standard quantity","Actual price \xD7 actual quantity","Purchases \xF7 production"],a:1,e:"Slide 34: standard purchase price plus standard procurement costs, times the standard quantity."},{ch:"production",q:"FLAX: opening FG 500 units at 1 330 \u20AC, production 3 000 units at 1 400 \u20AC. Weighted average cost?",o:["1 365 \u20AC","1 390 \u20AC","1 400 \u20AC","1 330 \u20AC"],a:1,e:"(665 + 4 200) \xF7 3 500 = 1 390 \u20AC. Not the simple average (1 365): weight by quantities."},{ch:"production",q:"Purchase volume of raw materials = \u2026",o:["Production needs + opening RM \u2212 closing RM","Production needs \u2212 opening RM + closing RM objective","Sales \u2212 production","Consumption \xD7 price"],a:1,e:"Slide 43: needs \u2212 opening RM stock + target closing stock."},{ch:"production",q:"Downstream inventories are\u2026",o:["Raw materials and goods","Work in progress, semi-finished and finished products","Receivables","Fixed assets"],a:1,e:"Downstream = WIP, semi-finished, finished goods. Upstream = raw materials and goods for resale."},{ch:"production",q:"The finished-goods inventory falls from 665 to 556 K\u20AC. In the income statement you record\u2026",o:["+109 as stored production","\u2212109 as stored production (change in inventory)","+109 as an expense","Nothing"],a:1,e:"Downstream change = closing \u2212 opening = \u2212109, on the revenue side."},{ch:"financing",q:"Which item never appears in a cash budget?",o:["Investment payment","Loan repayment","Depreciation allowance","Income tax paid"],a:2,e:"Depreciation is a non-cash charge. Same for provisions and inventory changes."},{ch:"financing",q:"Customers pay at 90 days. In Q1 of the budget year you cash\u2026",o:["The sales of Q1","The opening receivables of the balance sheet","Nothing","Half of Q1 sales"],a:1,e:"At 90 days a quarter\u2019s sales are cashed the next quarter, so Q1 collects the opening receivables."},{ch:"financing",q:"Customers pay at 60 days, quarterly sales 1 395. Receivables in the closing balance sheet?",o:["465","930","1 395","0"],a:1,e:"60 days = two months of Q4 still uncashed: 2/3 \xD7 1 395 = 930."},{ch:"financing",q:"FLAX closing cash Q4 is \u22121 089 K\u20AC, authorized overdraft 850 K\u20AC, no new debt allowed. Capital increase?",o:["1 089","239","850","0"],a:1,e:"1 089 \u2212 850 = 239 K\u20AC brings the overdraft back to its authorized level."},{ch:"financing",q:"In the financing table, an increase in WCR is\u2026",o:["A resource","A need (allocation)","Not shown","Part of the SFC"],a:1,e:"A growing WCR must be financed: it is a need."},{ch:"financing",q:"The simplified SFC (self-financing capacity) used in class is\u2026",o:["Sales \u2212 expenses","Net profit + depreciation","EBITDA \u2212 tax","Cash at year end"],a:1,e:"Add back the charge that never left the bank: net profit + depreciation."},{ch:"financing",q:"Which classification of investments distinguishes renewal, productivity and growth?",o:["Accounting logic","Economic logic (productive investments)","Risk logic","Legal logic"],a:1,e:"Economic logic: productive (renewal, productivity, growth), strategic, obligatory."},{ch:"financing",q:"Zero-base budgeting (ZBB) aims to\u2026",o:["Set every budget to zero","Stop renewing last year\u2019s budget plus inflation by justifying each expense","Reach zero cash","Remove all functional services"],a:1,e:"ZBB forces every expense to be justified from scratch."},{ch:"financing",q:"Large retailers often have\u2026",o:["A huge WCR","A negative WCR (operating cash surplus)","No inventories","No suppliers"],a:1,e:"Customers pay cash, suppliers wait 60 to 90 days: operating resources exceed needs."},{ch:"financing",q:"TEAU repays 850 000 \u20AC of ST debts. In the financing table this is\u2026",o:["A resource","A need","Part of the WCR","Ignored"],a:1,e:"Repaying a financial debt is a need; a new loan is a resource."},{ch:"centers",q:"A workshop measured in machine-hours, responsible only for its costs, is a\u2026",o:["Revenue center","Cost center","Profit center","Investment center"],a:1,e:"Cost center: responsible for its costs, activity measured by a work unit."},{ch:"centers",q:"A manager responsible for revenues, expenses AND the capital invested runs a\u2026",o:["Profit center","Investment center","Expense center","Discretionary center"],a:1,e:"Investment center: on top of profit, it answers for the return on capital."},{ch:"centers",q:"At consolidation, internal transactions between centers\u2026",o:["Are added to external sales","Are cancelled after checking that internal products = internal charges","Are taxed","Are moved to the balance sheet"],a:1,e:"Internal revenue for one is an internal charge for the other: check they match, then eliminate them."},{ch:"centers",q:"BRIOLET: why does the 2 800 \u201Cproduction transferred\u201D not appear in the global income statement?",o:["It is an internal transfer between two centers of the same firm","It is paid in cash","It is a fixed cost","It is a mistake"],a:0,e:"Lisbon \u2192 Vincennes is internal: it cancels out at firm level."},{ch:"variance",q:"In the quantity variance, quantities are valued at\u2026",o:["The actual price","The budgeted (pre-established) price","The average price","The market price"],a:1,e:"Quantity variance uses the BUDGET price; price variance uses ACTUAL quantities."},{ch:"variance",q:"Material: forecast 12 units at 6 \u20AC, actual 16 units at 8 \u20AC. Price variance?",o:["\u221224","\u221232","\u221256","+32"],a:1,e:"16 \xD7 (6 \u2212 8) = \u221232 U. Quantity: (12 \u2212 16) \xD7 6 = \u221224. Total \u221256."},{ch:"variance",q:"Labour: forecast 12 h at 300 \u20AC, actual 8 h at 400 \u20AC. Time variance?",o:["+1 200 favourable","\u2212800 unfavourable","+400 favourable","\u22121 200 unfavourable"],a:0,e:"(12 \u2212 8) \xD7 300 = +1 200 F. Rate: 8 \xD7 (300 \u2212 400) = \u2212800 U. Total +400 F."},{ch:"variance",q:"BILLOT American billiards: forecast 245 units at 1.4 K\u20AC, actual 300 units at 1.3 K\u20AC. Volume variance (actual \u2212 forecast)?",o:["+55","+77","+71.5","\u221230"],a:1,e:"(300 \u2212 245) \xD7 1.4 = +77 K\u20AC F. Price: (1.3 \u2212 1.4) \xD7 300 = \u221230. Total +47."},{ch:"variance",q:"An a priori control\u2026",o:["Analyses results after the period","Checks that intended decisions fit the policy and goals","Is done by the tax authorities","Is the same as self-control"],a:1,e:"A priori = before acting, operational = during (self-control), a posteriori = after."},{ch:"variance",q:"If a variance has a durable external cause (e.g. an oil shock), the controller should\u2026",o:["Ignore it","Consider reviewing the standards","Punish the manager","Delete the budget"],a:1,e:"A lasting external cause is a reason to review the standards (the course cites 1973)."},{ch:"further",q:"Financial leverage improves return on equity when\u2026",o:["The interest rate is higher than the profitability of invested capital","The interest rate is lower than the profitability of invested capital","The firm has no debt","The tax rate is zero"],a:1,e:"If i < ICP, every borrowed euro earns more than it costs. Otherwise: bludgeon effect."},{ch:"further",q:"Daily sales 36 K\u20AC, normative WCN 59 days. WCN in K\u20AC?",o:["1 296","2 124","590","36"],a:1,e:"59 \xD7 36 = 2 124 K\u20AC."},{ch:"analysis",q:"Net cash = \u2026",o:["WC + WCR","WC \u2212 WCR","WCR \u2212 WC","Equity \u2212 fixed assets"],a:1,e:"Net cash = working capital \u2212 working capital requirements."},{ch:"analysis",q:"Working capital (WC) = \u2026",o:["Inventories + receivables \u2212 payables","Stable resources \u2212 fixed assets","Cash \u2212 overdraft","Sales \u2212 expenses"],a:1,e:"WC = stable resources (equity, depreciation, LMT debt) \u2212 fixed assets."},{ch:"analysis",q:"Banker\u2019s ratio financial fees \xF7 EBITDA above 30 % means\u2026",o:["A comfortable situation","A risky area","A normal situation","Nothing"],a:1,e:"Below 20 % good, 20 to 30 % normal, above 30 % risky."},{ch:"bases",q:"A firm with a positive bank balance is necessarily profitable.",o:["True","False"],a:1,e:"False: cash also depends on loans, contributions, payment delays\u2026 Cash \u2260 profit."},{ch:"bases",q:"RM consumption = \u2026",o:["Purchases + closing \u2212 opening inventory","Purchases + opening \u2212 closing inventory","Sales \u2212 purchases","Purchases only"],a:1,e:"Purchases + (opening \u2212 closing)."},{ch:"bases",q:"With rising purchase prices, which method gives the highest profit?",o:["LIFO","FIFO","Weighted average","They are equal"],a:1,e:"FIFO consumes the old, cheaper lots, so consumption is lowest and profit highest (Dupont: 69 600 vs 56 427 WAC vs 43 600 LIFO)."}],ae=[{ch:"policy",q:"What is budgetary control NOT, and what IS it?",a:"It is not a simple check of whether actuals fit the budget. It is a key piloting tool: it includes strategic aspects, helps business-unit managers understand trends and make decisions, and motivates managers and workers (it induces behaviours).",key:"A piloting tool, not a scoreboard."},{ch:"policy",q:"Describe the management cycle from policy to targets.",a:"Reference framework (policy & strategy) \u2192 forecasting (scenarios) \u2192 deciding (objectives) \u2192 quantifying (funds & resources) \u2192 executing (coordinated actions) \u2192 controlling (results & gap analysis) \u2192 corrective actions and revised objectives.",key:"Forecast, decide, quantify, execute, control, correct."},{ch:"policy",q:"What does the reference framework include?",a:"The vocation (what the firm does, its purpose), the goals (why: profit, growth, market share, financial independence\u2026) and the ethics (how: the rules of the game, acceptable behaviours).",key:"What, why, how."},{ch:"policy",q:"Name the three steps of the budget allocation process.",a:"1) Definition of goals by top management (profit level, business volume, new markets). 2) Simulation by operational managers (activity forecasts, associated means, expenses). 3) Negotiation, consolidation and final target setting.",key:"Goals, simulation, negotiation."},{ch:"policy",q:"Why is the budget process iterative?",a:"Investment choices change depreciation; financing choices and overdrafts change financial expenses; this changes the estimated result, hence self-financing and the financing table, hence the cash plan. Several loops are needed until the budget fits the objectives. Negotiations between managers and top management add more loops.",key:"Every financing decision feeds back into the result."},{ch:"policy",q:"Short, mid and long-term plans: horizon and nature?",a:"Short term = 1 year, operational (the budget). Mid term = about 3 years, tactical. Long term = strategic. The budget is the first year of the mid-term plan.",key:"1 year operational, 3 years tactical, beyond strategic."},{ch:"policy",q:"Compare the domination and differentiation strategies.",a:"Domination (volume/price): grow volumes by lowering prices, so cut costs through productivity, with less qualified, cheaper labour. Differentiation: stand out by quality, technology or service to sell at higher prices to customers willing to pay, with more qualified labour.",key:"Low price and volume vs high price and value."},{ch:"sales",q:"How do you compute the sales volume with market growth and a market-share target?",a:"Volume = previous volume \xD7 (1 + market growth) \xD7 (target share \xF7 current share). Example: 100 \xD7 1.03 \xD7 21/20 = 108. Market-share percentages are never added.",key:"Multiply the coefficients."},{ch:"sales",q:"Why do payment terms matter in the sales budget?",a:"Extra payment time granted to customers is like a loan: it increases receivables and the WCR, which must be financed (overdraft, discount) at a cost. Payment terms must be followed and built into the cash budget.",key:"Customer credit = WCR to finance."},{ch:"sales",q:"What is the contribution margin of a sales department?",a:"Total sales \u2212 variable costs = gross margin; gross margin \u2212 marketing structure costs (sales management, salaries, travel, depreciation of the department) = contribution margin.",key:"Sales \u2212 variable \u2212 structure."},{ch:"production",q:"How is the production program determined?",a:"Production volume = estimated sales volume \u2212 opening finished-goods inventory + closing finished-goods inventory objective. The opening inventory must be estimated because the budget is prepared before year end.",key:"Sales \u2212 opening + closing."},{ch:"production",q:"How is a standard direct-labour cost built?",a:"Standard time per operation (by worker qualification) \xD7 standard hourly rate including social contributions; the product\u2019s DL cost is the sum over all operations. It depends on the human-resources policy.",key:"Standard time \xD7 standard rate."},{ch:"production",q:"Explain the six steps to value the closing finished-goods inventory.",a:"1) Opening value = qty \xD7 unit cost. 2) Production value = qty \xD7 standard unit cost. 3) Total cost = opening + production. 4) Weighted average unit cost = total cost \xF7 total quantity. 5) Cost of goods sold = WAC \xD7 quantity sold. 6) Closing inventory = total \u2212 cost of goods sold = WAC \xD7 closing quantity.",key:"Blend, then value everything at the WAC."},{ch:"production",q:"What does the total supply-function budget include?",a:"The purchasing budget, the other variable costs budget (transport, customs), the fixed costs budget (procurement staff, rent, depreciation) and the upstream (raw materials) inventory budget.",key:"Purchases, variable, fixed, RM stock."},{ch:"financing",q:"List three ways to classify investments.",a:"Accounting logic: intangible, tangible, financial assets. Economic logic: productive (renewal, productivity, growth), strategic (diversification, image, brand), obligatory (safety, environment). Risk logic: low risk (renewal, productivity) vs high risk (growth, diversification). They complement each other.",key:"Accounting, economic, risk."},{ch:"financing",q:"What is the WCN and how is it calculated in a budget?",a:"Working capital needs = allocations linked to activity (inventories, receivables, bills receivable, VAT to recover) \u2212 resources linked to activity (payables, bills payable, VAT due, customer advances, debts to personnel). If negative, it is an operating cash surplus.",key:"Operating assets \u2212 operating debts."},{ch:"financing",q:"What does the financing table show?",a:"The total balance between needs (investments, increase in WCN, loan repayments, dividends) and resources (SFC / retained earnings, capital increase, new MLT loans, disposals, authorized overdraft) over the period. Long-term capital should finance investments and part of the WCN.",key:"Needs vs resources of the period."},{ch:"financing",q:"Why are depreciation and provisions not in the cash budget?",a:"They are calculated charges: they reduce profit but no money leaves the firm. Only real inflows and outflows are recorded, when they happen (payment delays included).",key:"Non-cash charges."},{ch:"financing",q:"Describe the structure of the cash table.",a:"Opening balance carried forward, operational inflows, operational outflows, VAT regularization, non-operational flows (profit sharing, income tax), investment outflows, inflows from capital increase, loans and subsidies, then the closing balance before and after financial fees. A month\u2019s closing balance is the next month\u2019s opening balance.",key:"Opening + in \u2212 out = closing, carried forward."},{ch:"financing",q:"How do you build the estimated balance sheet?",a:"Start from the opening balance sheet after profit allocation. Assets go up with investments and WCN increases and down with depreciation and disinvestments. Liabilities go up with capital increases, the result and new loans, and down with loan repayments and losses.",key:"Opening balance sheet + the year\u2019s movements."},{ch:"financing",q:"How do you find the capital increase in FLAX-type cases?",a:"Build the quarterly cash budget. If the closing cash is below the authorized overdraft and no new debt is allowed, the capital increase equals the gap: |closing cash| \u2212 authorized overdraft (FLAX: 1 089 \u2212 850 = 239 K\u20AC).",key:"Whatever exceeds the authorized overdraft."},{ch:"centers",q:"Name the types of responsibility centers.",a:"Revenue centers (turnover target), cost centers (costs, activity measured by work units), expense centers (costs, activity hard to measure), profit centers (revenues and expenses, EBIT or contribution margin), investment centers (also capital invested and its return), discretionary expenditure centers (an envelope not to exceed).",key:"Revenue, cost, expense, profit, investment, discretionary."},{ch:"centers",q:"How can internal transactions be valued?",a:"At actual cost (known late), standard cost (technical study or budget), standard cost plus a normal margin, market price, or a price negotiated between centers. The choice does not change the firm\u2019s profit but changes each center\u2019s result, so it drives behaviour.",key:"Cost, standard, standard + margin, market, negotiated."},{ch:"variance",q:"Name the three types of control.",a:"A priori control (before: decisions coherent with policy and goals), operational control (during the action; self-control when power is delegated), a posteriori control (after: compare results with forecasts and explain variances to improve the management system).",key:"Before, during, after."},{ch:"variance",q:"How do you split a total sales variance?",a:"Quantity variance = (actual qty \u2212 forecast qty) \xD7 forecast price. Price variance = (actual price \u2212 forecast price) \xD7 actual qty. Their sum is the total variance (actual turnover \u2212 forecast turnover). Write F (favourable) or U (unfavourable).",key:"Quantity at budget price, price on actual quantities."},{ch:"variance",q:"What are the three levels of variance in a cost center?",a:"Cost variance (personnel and other charges: variable cost and fixed-cost allocation), output (productivity) variance (labour and equipment), and activity volume variance.",key:"Cost, output, volume."},{ch:"variance",q:"Why analyse variances?",a:"To understand root causes (not to find culprits), to review standards when the cause is external and durable, to extend a favourable practice to other units, and to act fast on unfavourable variances.",key:"Understand, adjust, spread good practice."},{ch:"further",q:"Explain financial leverage.",a:"When the interest rate on loans is lower than the profitability of invested capital (ICP = (net income + tax + interest) \xF7 (equity + LMT debt)), borrowing increases the return on equity. If the rate is higher, borrowing destroys it (bludgeon effect).",key:"i < ICP: debt boosts ROE."},{ch:"further",q:"What is the normative WCN?",a:"A WCN expressed in days of sales (excl. tax), based on objectives for inventory, receivables and supplier turnover: each item \xF7 daily sales gives a number of days; WCN in \u20AC = total days \xD7 daily sales.",key:"The WCN in days of sales."},{ch:"bases",q:"Define the balance sheet and the income statement.",a:"The balance sheet is a snapshot of the firm\u2019s position at a precise date: assets (what it owns) and liabilities (where the funds come from), with assets = liabilities. The income statement is the \u201Cmovie\u201D of a period: all revenues \u2212 all expenses = profit or loss, which goes to equity.",key:"A photo vs a movie."},{ch:"bases",q:"Explain the relationship between profit and cash.",a:"Profit depends only on income-statement operations; cash depends on balance-sheet and income-statement operations (loans, investments, capital, payment delays, depreciation that is never paid). A profitable firm can be overdrawn (BRIDE: profit 601, cash \u221285).",key:"Cash \u2260 profit."},{ch:"bases",q:"How are purchases of raw materials booked?",a:"Debit \u201Cpurchases of raw materials\u201D (expense), credit \u201Cbank\u201D if paid or \u201Csuppliers\u201D (liability) if bought on credit. At year end, the change in RM inventory (opening \u2212 closing) turns purchases into consumption.",key:"Debit purchases, credit bank or suppliers."},{ch:"bases",q:"A purchase of 22 000 is payable at 60 days: what entries, and when?",a:"On the invoice date: debit purchases 22 000, credit suppliers 22 000. On payment, 60 days later: debit suppliers 22 000, credit bank 22 000.",key:"Two entries: invoice, then payment."},{ch:"bases",q:"What can shareholders decide about the profit?",a:"Allocate it to reserves (legal, statutory, free), pay dividends, or carry it forward. A loss-making company can pay dividends only out of existing reserves.",key:"Reserves, dividends, carry forward."}],ke=[{q:"Book-keeping makes it possible to have, at any time, accurate information about the firm\u2019s position with respect to third parties.",a:!0,e:"Yes: debts and receivables are always up to date."},{q:"The accountant refunds an employee\u2019s professional expenses by cheque. He debits the bank account.",a:!1,e:"No: the bank is credited (money leaves) and an expense account is debited."},{q:"The head of the firm withdraws money from the bank to feed the cash box. The accountant records the operation in 2 accounts.",a:!0,e:"Yes: debit cash box, credit bank."},{q:"The firm has an overdraft. That results in a credit balance in its bank account.",a:!0,e:"Yes: an overdraft is a debt to the bank, so a credit balance."},{q:"All the purchases of the firm are recorded in the income statement.",a:!1,e:"No: fixed-asset purchases (machines, buildings) go to the balance sheet."},{q:"Materials consumed during a period always correspond exactly to the purchases.",a:!1,e:"No: correct for the change in inventory (consumption = purchases + opening \u2212 closing)."},{q:"Interests on loans are booked as charges in the income statement.",a:!0,e:"Yes: financial expenses. Repaying the capital is not a charge."},{q:"The accountant only records, in the income statement, the sales actually cashed.",a:!1,e:"No: every invoiced sale is revenue, cashed or not (the rest becomes receivables)."},{q:"The result (revenues \u2212 expenses), when it is a profit, is registered on the side of the charges.",a:!0,e:"Yes: in the T-account layout, profit sits on the charges side to balance it."}],we=[{q:"In the assets you find\u2026",o:["The amount of the purchases of the period","Sums due by customers at a precise date","Reserves constituted by the firm"],a:[1],e:"Receivables. Purchases are in the income statement, reserves in liabilities."},{q:"In the liabilities you find\u2026",o:["All debts of the firm at a precise date","Goods, means and rights at a precise date","The amount of the authorized capital"],a:[0,2],e:"Debts and capital. Goods and rights are assets."},{q:"Depreciation registered in the balance sheet\u2026",o:["Represents the depreciation of the period","Represents the sum (accumulation) of depreciation","Allows to calculate the depreciation of the pe
